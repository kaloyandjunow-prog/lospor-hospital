name: Hospital quality

on:
  push:
    # Release tags are checked exactly once through workflow_call from
    # release.yml. Running this workflow independently for the same tag used to
    # create a duplicate gate whose concurrency cancellation could kill the
    # real release gate.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  # The release workflow calls this exact gate and cannot publish until both
  # jobs below have completed. Keeping one implementation prevents a release
  # tag from quietly exercising less than an ordinary pull request.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hospital-quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: lospor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d lospor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lospor_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/lospor_test
      LOSPOR_POSTGRES_INTEGRATION: "true"
      LOSPOR_DEPLOYMENT_MODE: hospital
      LOSPOR_AUTH_SECRET: ci-only-auth-secret-not-for-production
      NEXTAUTH_SECRET: ci-only-auth-secret-not-for-production
      HOSPITAL_PATIENT_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HOSPITAL_PATIENT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HOSPITAL_EXPORT_PSEUDONYM_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OMOP_PSEUDONYM_SALT: ci-only-pseudonym-salt
      # github.workspace, not runner.temp: the runner context is not available
      # in job-level env, and referencing it there makes the whole workflow fail
      # to parse before a single job is created. .data is already gitignored.
      HOSPITAL_EXPORT_DIR: ${{ github.workspace }}/.data/hospital-exports
      RESEARCH_EXPORT_STORAGE_DRIVER: filesystem
      RESEARCH_EXPORT_STORAGE_DIR: ${{ github.workspace }}/.data/research-exports
      RESEARCH_EXPORT_WORKER_SECRET: ci-only-worker-secret
      HOSPITAL_WORKER_TOKEN: ci-only-hospital-worker-token
      CRON_SECRET: ci-only-cron-secret
      OPTION_LIBRARY_SNAPSHOT_SECRET: ci-only-snapshot-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # 24, matching every upstream repository the appliance vendors from.
          # The vendored lockfiles are produced by npm 11, which drops optional
          # peer dependencies that npm 10 insists on: on node 22 every `npm ci`
          # for apps/web died with "Missing: @swc/helpers@0.5.23 from lock
          # file". The lockfile is correct; the runtime was not.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/pwa/package-lock.json
            apps/browser/package-lock.json
            apps/status/package-lock.json
            vendor/lospor-core/package-lock.json
            vendor/exchange-contract/package-lock.json

      - name: Create export directories
        run: mkdir -p .data/hospital-exports .data/research-exports

      - name: Clean installs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix vendor/lospor-core
          npm ci --prefix vendor/exchange-contract
          npm ci --prefix apps/api
          npm ci --prefix apps/web
          npm ci --prefix apps/pwa
          npm ci --prefix apps/browser
          npm ci --prefix apps/status

      - name: Prepare PostgreSQL
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx tsx scripts/provision-preop-catalog.ts

      - name: Verify provenance, privacy, and telemetry boundaries
        run: npm run verify:provenance

      - name: Typecheck
        run: npm run typecheck

      - name: Tests, including PostgreSQL concurrency
        run: |
          npm run test
          npm run test:status-contracts

      - name: Hospital to Central synthetic full-story release gate
        run: npm run test:central-full-story

      - name: Strict lint
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/api run lint -- --max-warnings 0
          npm --prefix apps/web run lint -- --max-warnings 0
          npm --prefix apps/pwa run lint:strict
          npm --prefix apps/browser run lint -- --max-warnings 0
          npm --prefix apps/status run lint -- --max-warnings 0

      - name: Production builds
        run: npm run build

      - name: Dependency audit
        run: npm run audit

  appliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Verify resolved source, publication, and runtime Compose contracts
        run: |
          npm run test:release-compose
          npm run test:manual-release
          npm run test:release-artifacts
          npm run verify:release-workflow
          npm run test:release-workflow
          npm run test:distribution-boundaries
          npm run test:installer-contracts
          npm run test:secret-rotation
          npm run test:support-url
          npm run test:configurable-ports
          npm run test:guided-installer
          npm run test:operator-localization
          npm run test:delivery-worker
          npm run test:caddy-boundaries
          npm run test:compose-hardening
          npm run test:merge-safety
          npm run test:appliance-update
          npm run test:host-observability
          npm run test:terminology-status
          npm run test:update-pipeline

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p secrets/status .data/status-dev-secrets
          for secret in snapshot-token api-event-token rate-limit-key db-probe-password; do
            printf '%064d\n' 0 > "secrets/status/$secret"
          done
          printf '{"api":"%064d"}\n' 0 > secrets/status/event-tokens.json
          cp secrets/status/rate-limit-key .data/status-dev-secrets/fixture-control-token
          cp secrets/status/rate-limit-key .data/status-dev-secrets/snapshot-token
          cp secrets/status/event-tokens.json .data/status-dev-secrets/event-tokens.json
          cp secrets/status/rate-limit-key .data/status-dev-secrets/rate-limit-key
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout secrets/status/fallback-key.pem -out secrets/status/fallback-cert.pem >/dev/null 2>&1
          cp secrets/status/fallback-key.pem .data/status-dev-secrets/fallback-key.pem
          cp secrets/status/fallback-cert.pem .data/status-dev-secrets/fallback-cert.pem
          docker compose config --quiet
          docker compose -f compose.status-dev.yaml config --quiet

      - name: Build appliance images
        run: docker compose --profile tools build api web pwa browser status migrate tools postgres delivery-worker caddy

      - name: Prove backup and restore with the hardened PostgreSQL image
        run: |
          POSTGRES_IMAGE=lospor-hospital-postgres:source \
            sh scripts/test-backup-restore.sh

      - name: Prove exact PostgreSQL 17.6 Bookworm volume compatibility
        run: sh infra/docker/postgres-cross-base-upgrade.test.sh lospor-hospital-postgres:source

      - name: Verify hardened runtime images
        run: |
          node --test scripts/node-image-hardening.test.mjs scripts/bundle-offline.test.mjs
          POSTGRES_IMAGE=lospor-hospital-postgres:source \
          CURL_WORKER_IMAGE=lospor-hospital-curl-worker:source \
          CADDY_IMAGE=lospor-hospital-caddy:source \
            sh infra/docker/hardened-images.test.sh

      - name: Verify the production migrator image
        run: npm run test:migrator-image

      - name: Verify exact two-container Status harness
        run: sh scripts/test-status-dev.sh

  clinical-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LOSPOR_DEPLOYMENT_MODE: hospital
      LOSPOR_AUTH_SECRET: ci-only-auth-secret-not-for-production
      NEXTAUTH_SECRET: ci-only-auth-secret-not-for-production
      HOSPITAL_PATIENT_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HOSPITAL_PATIENT_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      HOSPITAL_EXPORT_PSEUDONYM_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OMOP_PSEUDONYM_SALT: ci-only-pseudonym-salt
      HOSPITAL_WORKER_TOKEN: ci-only-hospital-worker-token
      RESEARCH_EXPORT_WORKER_SECRET: ci-only-research-worker-secret
      CRON_SECRET: ci-only-cron-secret
      OPTION_LIBRARY_SNAPSHOT_SECRET: ci-only-snapshot-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/pwa/package-lock.json
            apps/browser/package-lock.json
            vendor/lospor-core/package-lock.json
            vendor/exchange-contract/package-lock.json

      - name: Install the isolated clinical E2E dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix vendor/lospor-core
          npm ci --prefix vendor/exchange-contract
          # exchange-contract's package.json resolves through ./dist (built
          # output), unlike core which points straight at TS source -- the
          # quality job gets this for free as a side effect of its first
          # `npm run typecheck` (which runs prepare:contract first), but nothing
          # here otherwise builds it, and Next's dev server fails to resolve
          # `@lospor/exchange-contract` for any api route that imports it.
          npm --prefix vendor/exchange-contract run build
          npm ci --prefix apps/api
          npm ci --prefix apps/web
          npm ci --prefix apps/pwa
          npm ci --prefix apps/browser
          npm --prefix apps/web exec playwright install --with-deps chromium
          npm --prefix apps/pwa exec playwright install chromium
          npm --prefix apps/browser exec playwright install chromium

      - name: Run the complete Hospital Web E2E suite
        run: npm run e2e:web-full

      - name: Run the complete Hospital PWA E2E suite
        run: npm run e2e:pwa-full

      - name: Run the complete Hospital Research Browser E2E suite
        run: npm run e2e:browser-full

      # A visual-regression suite that cannot show you the diff is a suite you
      # have to guess at. The clinical e2e job compares the preop form against a
      # committed screenshot, and when that failed the run reported a pixel
      # ratio and kept the image, the diff and the trace on a machine that was
      # about to be destroyed. Nothing was uploaded, so the only way to see what
      # had moved was to reproduce the whole job locally.
      - name: Keep the evidence when an end-to-end run fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clinical-e2e-failure
          path: |
            apps/web/test-results/**
            apps/web/playwright-report/**
            apps/pwa/test-results/**
            apps/browser/test-results/**
          retention-days: 7
          if-no-files-found: ignore
