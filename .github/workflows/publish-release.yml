name: Publish Hospital release

# Three inputs, normally filled by scripts/publish-release.mjs on the
# maintainer's machine: which candidate run, the maintainer's signature over its
# release.lock, and the typed confirmation. Everything else is derived from the
# candidate run itself and checked again by the write job: the version from the
# run's tag, the attempt from the run, and the lock and signature digests from
# the downloaded bytes. The signature, verified against the committed public
# key, is what binds the approval to the exact lock.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Hospital release candidate workflow run ID
        required: true
        type: string
      release_signature_base64:
        description: Canonical base64 of the maintainer's 64-byte Ed25519 signature over that run's release.lock
        required: true
        type: string
      confirm_publication:
        description: Type PUBLISH hospital-X.Y.Z for the version that run built
        required: true
        type: string

permissions:
  contents: read

# One publication at a time. The version is not known until the run is read.
concurrency:
  group: hospital-publication
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      candidate_artifact_id: ${{ steps.provenance.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.provenance.outputs.candidate_artifact_digest }}
      candidate_commit: ${{ steps.provenance.outputs.candidate_commit }}
      candidate_tag: ${{ steps.provenance.outputs.candidate_tag }}
      candidate_run_attempt: ${{ steps.provenance.outputs.candidate_run_attempt }}
      version: ${{ steps.provenance.outputs.version }}
      lock_sha256: ${{ steps.lock.outputs.lock_sha256 }}
      signature_sha256: ${{ steps.lock.outputs.signature_sha256 }}
    steps:
      - name: Validate manual publication inputs and public repository boundary
        shell: bash
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_SIGNATURE_BASE64: ${{ inputs.release_signature_base64 }}
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo "Publication must be dispatched from main." >&2; exit 1; }
          test "$GITHUB_REPOSITORY" = kaloyandjunow-prog/lospor-hospital
          # Hospitals install and update anonymously from this repository and its
          # GHCR images, so a private repository would publish a release no site
          # could download.
          test "$REPOSITORY_VISIBILITY" = public || { echo "Hospital publication requires the public repository hospitals install from." >&2; exit 1; }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$RELEASE_SIGNATURE_BASE64"
          [[ "$CONFIRM_PUBLICATION" =~ ^PUBLISH\ hospital-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "Type the confirmation as PUBLISH hospital-X.Y.Z." >&2; exit 1; }

      - name: Check out only the trusted default-branch publication code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Authenticate read-only access to private candidate images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: provenance
        name: Verify the exact successful candidate run and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/candidate-run.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$run_json"
          test "$(node -p "require('$run_json').event")" = push
          test "$(node -p "require('$run_json').conclusion")" = success
          test "$(node -p "require('$run_json').repository.full_name")" = "$GITHUB_REPOSITORY"
          test "$(node -p "require('$run_json').repository.private")" = false
          # The version is the run's own tag, and the attempt the run's own: a
          # tag push runs on the tag, so neither is typed by anyone.
          RUN_ATTEMPT="$(node -p "require('$run_json').run_attempt")"
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          candidate_tag="$(node -p "require('$run_json').head_branch")"
          [[ "$candidate_tag" =~ ^hospital-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          VERSION="${candidate_tag#hospital-}"
          test "$CONFIRM_PUBLICATION" = "PUBLISH hospital-$VERSION" \
            || { echo "The confirmation names a different version than candidate run $RUN_ID built (hospital-$VERSION)." >&2; exit 1; }
          candidate_commit="$(node -p "require('$run_json').head_sha")"
          [[ "$candidate_commit" =~ ^[a-f0-9]{40}$ ]]
          workflow_id="$(node -p "require('$run_json').workflow_id")"
          workflow_path="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" --jq .path)"
          test "$workflow_path" = .github/workflows/release.yml

          ref_json="$RUNNER_TEMP/tag-ref.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/hospital-$VERSION" > "$ref_json"
          ref_type="$(node -p "require('$ref_json').object.type")"
          ref_sha="$(node -p "require('$ref_json').object.sha")"
          while [ "$ref_type" = tag ]; do
            tag_json="$RUNNER_TEMP/tag-object.json"
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" > "$tag_json"
            ref_type="$(node -p "require('$tag_json').object.type")"
            ref_sha="$(node -p "require('$tag_json').object.sha")"
          done
          test "$ref_type" = commit
          test "$ref_sha" = "$candidate_commit"

          artifact_name="hospital-$VERSION-$RUN_ID-$RUN_ATTEMPT-candidate"
          artifacts="$RUNNER_TEMP/candidate-artifacts.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$artifacts"
          node - "$artifacts" "$artifact_name" "$candidate_commit" > "$RUNNER_TEMP/artifact.tsv" <<'NODE'
          const fs = require("node:fs")
          const pages = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
          const matching = pages.flatMap(page => page.artifacts ?? [])
            .filter(item => item.name === process.argv[3] && item.expired === false)
          if (matching.length !== 1) throw new Error("Expected exactly one non-expired candidate artifact")
          const artifact = matching[0]
          if (artifact.workflow_run?.head_sha !== process.argv[4]) throw new Error("Candidate artifact belongs to a different commit")
          if (!/^sha256:[a-f0-9]{64}$/.test(artifact.digest ?? "")) throw new Error("Candidate artifact has no immutable REST digest")
          process.stdout.write(`${artifact.id}\t${artifact.digest}\n`)
          NODE
          IFS="$(printf '\t')" read -r artifact_id artifact_digest < "$RUNNER_TEMP/artifact.tsv"
          mkdir candidate
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/candidate.zip"
          test "sha256:$(sha256sum "$RUNNER_TEMP/candidate.zip" | awk '{print $1}')" = "$artifact_digest"
          unzip -Z1 "$RUNNER_TEMP/candidate.zip" > "$RUNNER_TEMP/candidate-members.txt"
          zipinfo -l "$RUNNER_TEMP/candidate.zip" > "$RUNNER_TEMP/candidate-zipinfo.txt"
          node scripts/verify-actions-artifact-archive.mjs \
            "$VERSION" candidate "$RUNNER_TEMP/candidate-members.txt" "$RUNNER_TEMP/candidate-zipinfo.txt"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d candidate
          rm "$RUNNER_TEMP/candidate.zip"
          echo "candidate_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "candidate_commit=$candidate_commit" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=hospital-$VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate_run_attempt=$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - id: lock
        name: Verify publication request, lock, manifest and exact candidate assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.provenance.outputs.version }}
          COMMIT: ${{ steps.provenance.outputs.candidate_commit }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          RUN_ATTEMPT: ${{ steps.provenance.outputs.candidate_run_attempt }}
          RELEASE_SIGNATURE_BASE64: ${{ inputs.release_signature_base64 }}
        run: |
          set -euo pipefail
          prefix="lospor-hospital-$VERSION"
          lock="candidate/$prefix-release.lock"
          checksum="$lock.sha256"
          # Digests of the downloaded bytes. Nothing is trusted for being typed:
          # the lock is bound by its sidecar, the handoff and the signature, and
          # the signature is verified against the committed public key below.
          EXPECTED_LOCK_SHA256="$(sha256sum "$lock" | awk '{print $1}')"
          EXPECTED_SIGNATURE_SHA256="$(node scripts/materialize-release-signature.mjs --digest "$RELEASE_SIGNATURE_BASE64")"
          test "$(cat "$checksum")" = "$EXPECTED_LOCK_SHA256  $prefix-release.lock"
          (cd candidate && sha256sum --check --strict "$prefix-release.lock.sha256")
          node scripts/verify-release-handoff.mjs \
            "candidate/$prefix-publication-request.tsv" "$lock" \
            "$VERSION" "$COMMIT" "$RUN_ID" "$RUN_ATTEMPT"
          node scripts/verify-release-candidate.mjs "$VERSION" candidate candidate-assets "$COMMIT"
          node scripts/verify-release-artifacts.mjs \
            "candidate/$prefix-manifest.json" "$lock" "$checksum" candidate
          node scripts/verify-release-dossier.mjs \
            "candidate/$prefix-security-evidence.tar.gz" "$lock" --run "$RUN_ID" --attempt "$RUN_ATTEMPT"
          gh attestation verify "$lock" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          git diff --exit-code "$COMMIT" "$GITHUB_SHA" -- infra/release-signing/release-signing-public.pem
          node scripts/materialize-release-signature.mjs \
            "$lock" "$RELEASE_SIGNATURE_BASE64" "$EXPECTED_SIGNATURE_SHA256" \
            infra/release-signing/release-signing-public.pem
          test "$(sha256sum "$lock.sig" | awk '{print $1}')" = "$EXPECTED_SIGNATURE_SHA256"
          echo "lock_sha256=$EXPECTED_LOCK_SHA256" >> "$GITHUB_OUTPUT"
          echo "signature_sha256=$EXPECTED_SIGNATURE_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify all ten private-registry image identities
        shell: bash
        env:
          VERSION: ${{ steps.provenance.outputs.version }}
        run: |
          set -euo pipefail
          image_lock="candidate/lospor-hospital-$VERSION-images.json"
          node scripts/verify-registry-image-lock.mjs "$image_lock" "$VERSION" --immutable-only
          node scripts/image-lock.mjs refs "$image_lock" "$VERSION" > "$RUNNER_TEMP/release-images.tsv"
          test "$(wc -l < "$RUNNER_TEMP/release-images.tsv" | tr -d '[:space:]')" = 10

      - name: Prove integrity-verified online and registry-independent offline installation
        shell: bash
        env:
          HOSPITAL_ALLOW_UNSUPPORTED_TEST_HOST: "1"
          HOSPITAL_RELEASE_TEST_ONLY: "1"
          VERSION: ${{ steps.provenance.outputs.version }}
        run: |
          set -euo pipefail
          prefix="lospor-hospital-$VERSION"
          bootstrap="$RUNNER_TEMP/hospital-online/bootstrap"
          home="$RUNNER_TEMP/hospital-online/home"
          mkdir -p "$bootstrap/scripts" "$home/secrets"
          cp infra/release-signing/release-signing-public.pem "$home/secrets/release-signing-public.pem"
          for script in activate-verified-release.sh installed-release-state.sh operator-locale.sh run-online-release.sh update-pipeline-lib.sh verify-loaded-release-images.sh verify-release-signature.sh verify-release.sh; do
            cp "scripts/$script" "$bootstrap/scripts/$script"
          done
          ln -s "$home" "$bootstrap/.lospor-home"
          # No registry credential, exactly like a hospital: the launcher pulls
          # into an empty Docker config, so this passes only while the release
          # images are public.
          sh "$bootstrap/scripts/run-online-release.sh" \
            "candidate/$prefix-release.lock" "candidate/$prefix-release.lock.sha256" candidate -- \
            sh -c 'set -e; sudo -E sh scripts/test-install.sh; ln -s "$LOSPOR_APPLIANCE_HOME/.env" .env'
          test -L "$home/current"
          grep -Eq "^LOSPOR-HOSPITAL-INSTALLED-RELEASE-V1[[:space:]]+$VERSION[[:space:]]" \
            "$home/.data/installed-release.tsv"

          refs="$(awk -F '\t' '$1 == "image" {print $3 " " $3 "@" $4}' "candidate/$prefix-release.lock")"
          # This dedicated runner must prove the archive without registry-pulled
          # references or BuildKit cache satisfying the offline installation.
          # shellcheck disable=SC2086
          docker image rm --force $refs
          docker builder prune --all --force
          docker image prune --all --force
          while IFS="$(printf '\t')" read -r reference immutable config_digest extra; do
            test -z "${extra:-}"
            ! docker image inspect "$reference" >/dev/null 2>&1
            ! docker image inspect "$immutable" >/dev/null 2>&1
          done < "$RUNNER_TEMP/release-images.tsv"

          bootstrap="$RUNNER_TEMP/hospital-offline/bootstrap"
          home="$RUNNER_TEMP/hospital-offline/home"
          mkdir -p "$bootstrap/scripts" "$home/secrets"
          cp infra/release-signing/release-signing-public.pem "$home/secrets/release-signing-public.pem"
          for script in activate-verified-release.sh installed-release-state.sh load-offline.sh operator-locale.sh update-pipeline-lib.sh verify-loaded-release-images.sh verify-release-signature.sh verify-release.sh; do
            cp "scripts/$script" "$bootstrap/scripts/$script"
          done
          ln -s "$home" "$bootstrap/.lospor-home"
          sh "$bootstrap/scripts/load-offline.sh" \
            "candidate/$prefix-release.lock" "candidate/$prefix-release.lock.sha256" candidate -- \
            sh -c 'set -e; sudo -E sh scripts/test-install.sh; ln -s "$LOSPOR_APPLIANCE_HOME/.env" .env'
          test -L "$home/current"
          grep -Eq "^LOSPOR-HOSPITAL-INSTALLED-RELEASE-V1[[:space:]]+$VERSION[[:space:]]" \
            "$home/.data/installed-release.tsv"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out only the trusted default-branch publication code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-download and independently verify the original candidate before writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_RUN_ATTEMPT: ${{ needs.verify.outputs.candidate_run_attempt }}
          EXPECTED_COMMIT: ${{ needs.verify.outputs.candidate_commit }}
          EXPECTED_TAG: ${{ needs.verify.outputs.candidate_tag }}
          EXPECTED_LOCK_SHA256: ${{ needs.verify.outputs.lock_sha256 }}
          RELEASE_SIGNATURE_BASE64: ${{ inputs.release_signature_base64 }}
          EXPECTED_SIGNATURE_SHA256: ${{ needs.verify.outputs.signature_sha256 }}
          EXPECTED_ARTIFACT_ID: ${{ needs.verify.outputs.candidate_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.verify.outputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo "Publication must still identify main." >&2; exit 1; }
          test "$GITHUB_REPOSITORY" = kaloyandjunow-prog/lospor-hospital
          test "$REPOSITORY_VISIBILITY" = public
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test "$EXPECTED_TAG" = "hospital-$EXPECTED_VERSION"
          [[ "$EXPECTED_LOCK_SHA256" =~ ^[a-f0-9]{64}$ ]]
          test -n "$RELEASE_SIGNATURE_BASE64"
          [[ "$EXPECTED_SIGNATURE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          # Everything the read-only job derived is derived again here and must
          # agree, so a changed run, tag or artifact between jobs stops the write.
          run_json="$RUNNER_TEMP/candidate-run.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$run_json"
          test "$(node -p "require('$run_json').event")" = push
          test "$(node -p "require('$run_json').conclusion")" = success
          test "$(node -p "require('$run_json').repository.full_name")" = "$GITHUB_REPOSITORY"
          test "$(node -p "require('$run_json').repository.private")" = false
          RUN_ATTEMPT="$(node -p "require('$run_json').run_attempt")"
          test "$RUN_ATTEMPT" = "$EXPECTED_RUN_ATTEMPT"
          candidate_tag="$(node -p "require('$run_json').head_branch")"
          test "$candidate_tag" = "$EXPECTED_TAG"
          VERSION="${candidate_tag#hospital-}"
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$CONFIRM_PUBLICATION" = "PUBLISH hospital-$VERSION"
          candidate_commit="$(node -p "require('$run_json').head_sha")"
          [[ "$candidate_commit" =~ ^[a-f0-9]{40}$ ]]
          test "$candidate_commit" = "$EXPECTED_COMMIT"
          workflow_id="$(node -p "require('$run_json').workflow_id")"
          workflow_path="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" --jq .path)"
          test "$workflow_path" = .github/workflows/release.yml

          ref_json="$RUNNER_TEMP/tag-ref.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$EXPECTED_TAG" > "$ref_json"
          ref_type="$(node -p "require('$ref_json').object.type")"
          ref_sha="$(node -p "require('$ref_json').object.sha")"
          while [ "$ref_type" = tag ]; do
            tag_json="$RUNNER_TEMP/tag-object.json"
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" > "$tag_json"
            ref_type="$(node -p "require('$tag_json').object.type")"
            ref_sha="$(node -p "require('$tag_json').object.sha")"
          done
          test "$ref_type" = commit
          test "$ref_sha" = "$candidate_commit"

          artifact_name="hospital-$VERSION-$RUN_ID-$RUN_ATTEMPT-candidate"
          artifacts="$RUNNER_TEMP/candidate-artifacts.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$artifacts"
          node - "$artifacts" "$artifact_name" "$candidate_commit" "$EXPECTED_ARTIFACT_ID" "$EXPECTED_ARTIFACT_DIGEST" > "$RUNNER_TEMP/candidate-artifact.tsv" <<'NODE'
          const fs = require("node:fs")
          const pages = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
          const matching = pages.flatMap(page => page.artifacts ?? [])
            .filter(item => item.name === process.argv[3] && item.expired === false)
          if (matching.length !== 1) throw new Error("Expected exactly one non-expired candidate artifact")
          const artifact = matching[0]
          if (artifact.workflow_run?.head_sha !== process.argv[4]) throw new Error("Candidate artifact belongs to a different commit")
          if (String(artifact.id) !== process.argv[5] || artifact.digest !== process.argv[6]) {
            throw new Error("Candidate artifact identity changed between jobs")
          }
          if (!/^sha256:[a-f0-9]{64}$/.test(artifact.digest ?? "")) throw new Error("Candidate artifact has no immutable REST digest")
          process.stdout.write(`${artifact.id}\t${artifact.digest}\n`)
          NODE
          IFS="$(printf '\t')" read -r artifact_id artifact_digest < "$RUNNER_TEMP/candidate-artifact.tsv"
          mkdir release-assets
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/candidate.zip"
          test "sha256:$(sha256sum "$RUNNER_TEMP/candidate.zip" | awk '{print $1}')" = "$artifact_digest"
          unzip -Z1 "$RUNNER_TEMP/candidate.zip" > "$RUNNER_TEMP/candidate-members.txt"
          zipinfo -l "$RUNNER_TEMP/candidate.zip" > "$RUNNER_TEMP/candidate-zipinfo.txt"
          node scripts/verify-actions-artifact-archive.mjs \
            "$VERSION" candidate "$RUNNER_TEMP/candidate-members.txt" "$RUNNER_TEMP/candidate-zipinfo.txt"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d release-assets
          rm "$RUNNER_TEMP/candidate.zip"

          prefix="lospor-hospital-$VERSION"
          lock="release-assets/$prefix-release.lock"
          checksum="$lock.sha256"
          test "$(sha256sum "$lock" | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(node scripts/materialize-release-signature.mjs --digest "$RELEASE_SIGNATURE_BASE64")" = "$EXPECTED_SIGNATURE_SHA256"
          test "$(cat "$checksum")" = "$EXPECTED_LOCK_SHA256  $prefix-release.lock"
          (cd release-assets && sha256sum --check --strict "$prefix-release.lock.sha256")
          node scripts/verify-release-handoff.mjs \
            "release-assets/$prefix-publication-request.tsv" "$lock" \
            "$VERSION" "$candidate_commit" "$RUN_ID" "$RUN_ATTEMPT"
          node scripts/verify-release-candidate.mjs "$VERSION" release-assets candidate-assets "$candidate_commit"
          node scripts/verify-release-artifacts.mjs \
            "release-assets/$prefix-manifest.json" "$lock" "$checksum" release-assets
          node scripts/verify-release-dossier.mjs \
            "release-assets/$prefix-security-evidence.tar.gz" "$lock" --run "$RUN_ID" --attempt "$RUN_ATTEMPT"
          git diff --exit-code "$candidate_commit" "$GITHUB_SHA" -- infra/release-signing/release-signing-public.pem
          node scripts/materialize-release-signature.mjs \
            "$lock" "$RELEASE_SIGNATURE_BASE64" "$EXPECTED_SIGNATURE_SHA256" \
            infra/release-signing/release-signing-public.pem
          test "$(sha256sum "$lock.sig" | awk '{print $1}')" = "$EXPECTED_SIGNATURE_SHA256"

          image_lock="release-assets/$prefix-images.json"
          node scripts/verify-registry-image-lock.mjs "$image_lock" "$VERSION" --immutable-only
          cp "$image_lock" "$RUNNER_TEMP/release-images.json"

          rm "release-assets/$prefix-images.json" "release-assets/$prefix-publication-request.tsv"
          node scripts/verify-release-candidate.mjs "$VERSION" release-assets final-assets "$candidate_commit"

          ref_json="$RUNNER_TEMP/tag-ref-final.json"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/hospital-$VERSION" > "$ref_json"
          ref_type="$(node -p "require('$ref_json').object.type")"
          ref_sha="$(node -p "require('$ref_json').object.sha")"
          while [ "$ref_type" = tag ]; do
            tag_json="$RUNNER_TEMP/tag-object-final.json"
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" > "$tag_json"
            ref_type="$(node -p "require('$tag_json').object.type")"
            ref_sha="$(node -p "require('$tag_json').object.sha")"
          done
          test "$ref_type" = commit
          test "$ref_sha" = "$candidate_commit"

      - name: Promote exact verified image identities without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          image_lock="$RUNNER_TEMP/release-images.json"
          node - "$image_lock" > "$RUNNER_TEMP/custom-images.tsv" <<'NODE'
          const lock = require(process.argv[2])
          for (const image of lock.images) {
            const immutable = `${image.reference.slice(0, image.reference.lastIndexOf(":"))}@${image.digest}`
            process.stdout.write(`${image.name}\t${immutable}\t${image.reference}\n`)
          }
          NODE
          test "$(wc -l < "$RUNNER_TEMP/custom-images.tsv" | tr -d '[:space:]')" = 10
          while IFS="$(printf '\t')" read -r image_name immutable reference; do
            docker pull --platform linux/amd64 "$immutable" >/dev/null
            tag_state="$(node scripts/ghcr-tag-state.mjs "$reference")"
            case "$tag_state" in
              exists)
                node scripts/verify-registry-image-lock.mjs "$image_lock" "$VERSION" "$image_name"
                ;;
              absent)
                docker buildx imagetools create --prefer-index=false --tag "$reference" "$immutable"
                ;;
              *)
                echo "GHCR classifier returned an impossible state for $reference" >&2
                exit 1
                ;;
            esac
            node scripts/verify-registry-image-lock.mjs "$image_lock" "$VERSION" "$image_name"
          done < "$RUNNER_TEMP/custom-images.tsv"
          node scripts/verify-registry-image-lock.mjs "$image_lock" "$VERSION"

      - name: Create exact immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOSPITAL_RELEASE_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          COMMIT: ${{ needs.verify.outputs.candidate_commit }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          RUN_ATTEMPT: ${{ needs.verify.outputs.candidate_run_attempt }}
          EXPECTED_LOCK_SHA256: ${{ needs.verify.outputs.lock_sha256 }}
          EXPECTED_SIGNATURE_SHA256: ${{ needs.verify.outputs.signature_sha256 }}
        run: |
          set -euo pipefail
          tag="hospital-$VERSION"
          assert_tag_commit() {
            ref_json="$RUNNER_TEMP/release-tag-ref.json"
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$ref_json"
            ref_type="$(node -p "require('$ref_json').object.type")"
            ref_sha="$(node -p "require('$ref_json').object.sha")"
            while [ "$ref_type" = tag ]; do
              tag_json="$RUNNER_TEMP/release-tag-object.json"
              gh api -H "X-GitHub-Api-Version: 2026-03-10" \
                "repos/$GITHUB_REPOSITORY/git/tags/$ref_sha" > "$tag_json"
              ref_type="$(node -p "require('$tag_json').object.type")"
              ref_sha="$(node -p "require('$tag_json').object.sha")"
            done
            test "$ref_type" = commit
            test "$ref_sha" = "$COMMIT"
          }
          assert_tag_commit
          expected_title="LOSPOR Hospital $VERSION"
          release_marker="LOSPOR-HOSPITAL-PUBLICATION-V1 version=$VERSION commit=$COMMIT candidate=$RUN_ID/$RUN_ATTEMPT lock-sha256=$EXPECTED_LOCK_SHA256 signature-sha256=$EXPECTED_SIGNATURE_SHA256"
          expected_notes="$release_marker

          Integrity-verified LOSPOR Hospital $VERSION appliance, signed by the maintainer's release key."
          # The REST release object for this tag, including while it is a draft.
          #
          # `repos/{owner}/{repo}/releases/tags/{tag}` resolves published
          # releases only: GitHub does not associate a draft with its tag until
          # publication, so it answers 404 for exactly the release this step is
          # in the middle of creating. Publication failed there on its first
          # real run, after the images had already been promoted, leaving a
          # complete draft that nothing would finish.
          #
          # Listing includes drafts, so the tag is matched from the list.
          fetch_release_rest() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              > "$RUNNER_TEMP/all-releases.json"
            node - "$RUNNER_TEMP/all-releases.json" "$tag" \
              > "$RUNNER_TEMP/existing-release-rest.json" <<'NODE'
          const [path, tag] = process.argv.slice(2)
          const match = require(path).find(release => release.tag_name === tag)
          if (!match) throw new Error(`No release found for tag ${tag}`)
          process.stdout.write(JSON.stringify(match))
          NODE
          }
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/local-files"
          verify_release_assets() {
            target="$1"
            allow_starter="$2"
            mkdir "$target"
            rm -f "$RUNNER_TEMP/remote-files" "$RUNNER_TEMP/starter-assets.tsv"
            if [ "$allow_starter" = true ]; then
              node scripts/inspect-release-assets.mjs "$RUNNER_TEMP/existing-release-rest.json" \
                release-assets "$RUNNER_TEMP/remote-files" "$RUNNER_TEMP/starter-assets.tsv" --allow-starter
            else
              node scripts/inspect-release-assets.mjs "$RUNNER_TEMP/existing-release-rest.json" \
                release-assets "$RUNNER_TEMP/remote-files" "$RUNNER_TEMP/starter-assets.tsv"
            fi
            while IFS= read -r file; do
              gh release download "$tag" --pattern "$file" --dir "$target"
              cmp "release-assets/$file" "$target/$file"
            done < "$RUNNER_TEMP/remote-files"
          }
          validate_release_metadata() {
            node - "$1" "$tag" "$expected_title" "$expected_notes" <<'NODE'
          const [path, tag, title, notes] = process.argv.slice(2)
          const release = require(path)
          if (release.isPrerelease !== false || release.tagName !== tag
            || release.name !== title || release.body !== notes) {
            throw new Error("Existing release metadata is not the exact run-bound publication transaction")
          }
          NODE
          }
          resume_draft=false
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets,body,isDraft,isImmutable,isPrerelease,name,tagName,targetCommitish > "$RUNNER_TEMP/existing-release.json"
            fetch_release_rest
            validate_release_metadata "$RUNNER_TEMP/existing-release.json"
            if [ "$(node -p "require('$RUNNER_TEMP/existing-release.json').isImmutable")" = true ]; then
              verify_release_assets "$RUNNER_TEMP/existing-assets" false
              cmp "$RUNNER_TEMP/local-files" "$RUNNER_TEMP/remote-files"
              echo "Exact immutable release already exists; publication is an idempotent no-op."
              exit 0
            fi
            node - "$RUNNER_TEMP/existing-release.json" <<'NODE'
          const [path] = process.argv.slice(2)
          const release = require(path)
          if (release.isDraft !== true || release.isImmutable === true) {
            throw new Error("Existing release is neither the exact immutable replay nor a resumable draft")
          }
          NODE
            verify_release_assets "$RUNNER_TEMP/existing-assets" true
            while IFS="$(printf '\t')" read -r asset_id asset_name extra; do
              test -z "${extra:-}"
              [[ "$asset_id" =~ ^[1-9][0-9]*$ ]]
              grep -Fxq "$asset_name" "$RUNNER_TEMP/local-files"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done < "$RUNNER_TEMP/starter-assets.tsv"
            resume_draft=true
          fi

          if [ "$resume_draft" = false ]; then
            : > "$RUNNER_TEMP/remote-files"
            gh release create "$tag" --verify-tag --target "$COMMIT" --draft \
              --title "$expected_title" --notes "$expected_notes"
          fi
          while IFS= read -r file; do
            if ! grep -Fxq "$file" "$RUNNER_TEMP/remote-files"; then gh release upload "$tag" "release-assets/$file"; fi
          done < "$RUNNER_TEMP/local-files"

          verification="$RUNNER_TEMP/published-assets"
          fetch_release_rest
          verify_release_assets "$verification" false
          cmp "$RUNNER_TEMP/local-files" "$RUNNER_TEMP/remote-files"
          assert_tag_commit
          gh release edit "$tag" --draft=false
          gh release view "$tag" --json isImmutable --jq '.isImmutable == true' | grep -qx true
