name: Hospital release

on:
  push:
    tags:
      - "hospital-*"

permissions:
  contents: read

concurrency:
  group: hospital-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - id: release
        name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#hospital-}"
          test "$GITHUB_REF_NAME" = "hospital-$version"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Version must be exactly MAJOR.MINOR.PATCH; got '$version'." >&2
            exit 1
          }
          package_version="$(node -p "require('./package.json').version")"
          test "$package_version" = "$version" || {
            echo "package.json is $package_version but this run is for $version." >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require release-ready client localization import
        run: node scripts/client-localization-import-gate.mjs --require-ready

      # Fail here, not 52 minutes in. This gate reads release-inputs.json and
      # compares a version string -- it needs nothing that any build produces --
      # yet it used to run inside `candidate`, after the appliance images were
      # built. A release whose vulnerability review still named the previous
      # version burned the whole build before saying so.
      #
      # The provenance `create` in `candidate` still runs the same check against
      # the actual built image; this is the cheap pre-flight, not a replacement.
      - name: Require an explicit source-component vulnerability review
        run: |
          node scripts/postgres-source-provenance.mjs require-vulnerability-review \
            "${{ steps.release.outputs.version }}" release-inputs.json

      # release-compatibility.tsv states which release its migration range and
      # rollback policy describe, and nothing verified that against the release
      # actually being built. Tagging a new version while leaving this row on
      # the previous one would ship a release whose compatibility evidence
      # describes a different release -- and that row is what decides whether a
      # failed update may roll services back or must restore from backup.
      #
      # Another string comparison that needs no build, so it belongs here.
      - name: Require the compatibility row to describe this release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          row_version="$(awk -F '\t' 'NR == 1 { print $2 }' release-compatibility.tsv)"
          test "$row_version" = "$version" || {
            echo "release-compatibility.tsv describes $row_version but this run is for $version." >&2
            exit 1
          }
          echo "Compatibility row describes $version."

      # The version above is checked; schema_max was not, and that is the half
      # that carries the clinical risk. release-compatibility.sh validates only
      # that the name looks like a migration, and prepare-verified-release.sh
      # only that it exists in the tarball -- a name from three releases ago
      # passes both. schema_max is what a rollback claim is measured against:
      # it says "this release's schema ends here", so naming an older migration
      # understates the migrations an operator would have to undo, and does it
      # silently.
      #
      # The newest directory is the answer because migrations are timestamp
      # prefixed and applied in lexical order, which is the same order Prisma
      # itself uses.
      - name: Require schema_max to name the newest migration
        shell: bash
        run: |
          set -euo pipefail
          row_max="$(awk -F '\t' 'NR == 1 { print $4 }' release-compatibility.tsv)"
          newest="$(ls apps/api/prisma/migrations | grep -E '^[0-9]{14}_' | sort | tail -1)"
          test -n "$newest" || { echo "No migrations found to check schema_max against." >&2; exit 1; }
          test "$row_max" = "$newest" || {
            echo "release-compatibility.tsv names schema_max $row_max, but the newest migration is $newest." >&2
            exit 1
          }
          echo "schema_max names the newest migration ($newest)."

  quality:
    # Cheap identity and policy gates decide before an hour of building starts.
    needs: metadata
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read

  clean-appliance:
    needs: [metadata, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # This job builds every image from source -- including compiling
      # PostgreSQL -- and then takes a real backup. backup-once.sh refuses to
      # write one unless 5 GiB remains free, which is a deliberate policy for a
      # hospital and must not be lowered for CI. A stock runner does not have
      # that margin left after the build, so the job began failing on
      # BACKUP_CAPACITY_REFUSED: capacity, not anything it exists to test.
      #
      # These toolchains are preinstalled on the runner image and unused here.
      # The free space is printed either side because the failure reported no
      # numbers at all, which made a capacity problem look like a backup defect.
      - name: Reclaim runner disk before the source build
        run: |
          set -eu
          df -h / | awk 'NR == 2 { print "available before: " $4 }'
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /opt/ghc
          df -h / | awk 'NR == 2 { print "available after:  " $4 }'

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Exercise a source-built appliance from empty volumes
        env:
          HOSPITAL_ALLOW_UNSUPPORTED_TEST_HOST: "1"
        # Root, not the runner user: this exercises scripts/appliance-operator.sh
        # (via test-install.sh's own operator-verify/rotate checks), which
        # deliberately refuses non-root outside its own narrow, fixture-driven
        # STATUS_FALLBACK_CERTIFICATE_TEST_ONLY harness -- the same requirement
        # a real appliance install runs under. -E preserves setup-node's PATH.
        run: sudo -E sh scripts/test-install.sh

  candidate:
    needs: [metadata, quality, clean-appliance]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      HOSPITAL_RELEASE: ${{ needs.metadata.outputs.version }}
      HOSPITAL_IMAGE_REGISTRY: ghcr.io/kaloyandjunow-prog
      HOSPITAL_REQUIRE_DIGEST_BUILD_ARGS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # A blocked artifact upload was previously discovered only at the very
      # end of this job, after roughly an hour of image builds and scans had
      # already run. GitHub's storage quota check runs on its own schedule --
      # its own error text says every 6-12 hours -- independent of how much
      # has actually been deleted, so a one-line probe upload here is the only
      # way to know in advance whether the same block is still in effect. If
      # it is, failing here costs seconds instead of an hour.
      - name: Fail fast if Actions artifact storage is still over quota
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/storage-quota-probe
          date -u +%s > .data/storage-quota-probe/probe.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storage-quota-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: .data/storage-quota-probe/probe.txt
          retention-days: 1
          if-no-files-found: error

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load committed release inputs
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-inputs.mjs env release-inputs.json >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/hospital-release-images.tsv" <<'IMAGES'
          api api
          browser browser
          caddy caddy
          curl-worker delivery-worker
          migrate migrate
          postgres postgres
          pwa pwa
          status status
          tools tools
          web web
          IMAGES

      - name: Require approved digest-pinned build, runtime and scanner images
        shell: bash
        run: |
          set -euo pipefail
          check_ref() {
            label="$1"; expected="$2"; actual="$3"
            digest="${actual#"$expected"@sha256:}"
            if [ "$actual" = "$digest" ] || ! [[ "$digest" =~ ^[a-f0-9]{64}$ ]]; then
              echo "$label must be ${expected}@sha256:<64 lowercase hex>; got '${actual:-unset}'." >&2
              exit 1
            fi
            docker pull --platform linux/amd64 "$actual" >/dev/null
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$actual")" = linux/amd64
          }
          check_ref "API Node" node:24-alpine3.24 "$NODE_API_BASE_IMAGE"
          check_ref "Browser Node" node:24-alpine3.24 "$NODE_BROWSER_BASE_IMAGE"
          check_ref "PWA Node" node:24-alpine3.24 "$NODE_PWA_BUILD_BASE_IMAGE"
          check_ref "Status Node" node:24-alpine3.24 "$NODE_STATUS_BASE_IMAGE"
          check_ref "Web Node" node:24-alpine3.24 "$NODE_WEB_BASE_IMAGE"
          check_ref nginx nginx:1.30.4-alpine "$NGINX_PWA_BASE_IMAGE"
          check_ref PostgreSQL postgres:17.11-bookworm "$POSTGRES_BASE_IMAGE"
          check_ref "Caddy builder" golang:1.26.6-alpine3.24 "$CADDY_BUILD_BASE_IMAGE"
          check_ref "Caddy runtime" caddy:2.11.4-alpine "$CADDY_RUNTIME_BASE_IMAGE"
          check_ref curl curlimages/curl:8.21.0 "$CURL_BASE_IMAGE"
          check_ref Trivy aquasec/trivy:0.74.0 "$TRIVY_IMAGE"
          mkdir -p .data/release-evidence
          node - <<'NODE'
          const fs = require("node:fs")
          const names = [
            "NODE_API_BASE_IMAGE",
            "NODE_BROWSER_BASE_IMAGE",
            "NODE_PWA_BUILD_BASE_IMAGE",
            "NODE_STATUS_BASE_IMAGE",
            "NODE_WEB_BASE_IMAGE",
            "NGINX_PWA_BASE_IMAGE",
            "POSTGRES_BASE_IMAGE",
            "CADDY_BUILD_BASE_IMAGE",
            "CADDY_RUNTIME_BASE_IMAGE",
            "CURL_BASE_IMAGE",
            "TRIVY_IMAGE",
          ]
          fs.writeFileSync(".data/release-evidence/build-inputs.json", `${JSON.stringify({
            schemaVersion: 1,
            release: process.env.HOSPITAL_RELEASE,
            gitCommit: process.env.GITHUB_SHA,
            images: Object.fromEntries(names.map(name => [name, process.env[name]])),
          }, null, 2)}\n`, { flag: "wx" })
          NODE
          # Stable across retry attempts when (and only when) every custom
          # build input is unchanged. If an approved base digest changes during
          # a rerun, use a different candidate namespace instead of pretending
          # the old bytes came from the new input.
          build_identity="$(printf '%s\n' \
            "$NODE_API_BASE_IMAGE" "$NODE_BROWSER_BASE_IMAGE" \
            "$NODE_PWA_BUILD_BASE_IMAGE" "$NODE_STATUS_BASE_IMAGE" \
            "$NODE_WEB_BASE_IMAGE" "$NGINX_PWA_BASE_IMAGE" \
            "$POSTGRES_BASE_IMAGE" "$CADDY_BUILD_BASE_IMAGE" \
            "$CADDY_RUNTIME_BASE_IMAGE" "$CURL_BASE_IMAGE" \
            "$TRIVY_IMAGE" | sha256sum | awk '{print substr($1,1,16)}')"
          candidate="candidate-$GITHUB_SHA-$GITHUB_RUN_ID-$build_identity"
          echo "HOSPITAL_IMAGE_TAG=$candidate" >> "$GITHUB_ENV"
          echo "HOSPITAL_CANDIDATE_TAG=$candidate" >> "$GITHUB_ENV"

      - name: Prepare non-production Compose inputs
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          ./scripts/ensure-status-secrets.sh >/dev/null 2>&1
          ./scripts/ensure-api-secrets-layout.sh
          node scripts/verify-release-compose.mjs

      - name: Discover candidates already built by an earlier attempt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/hospital-candidates-missing.txt"
          : > "$RUNNER_TEMP/hospital-candidates-existing.txt"
          while read -r image_name service; do
            reference="ghcr.io/kaloyandjunow-prog/lospor-hospital-$image_name:$HOSPITAL_IMAGE_TAG"
            tag_state="$(node scripts/ghcr-tag-state.mjs "$reference" --allow-repository-absent)"
            case "$tag_state" in
              exists)
                docker pull --platform linux/amd64 "$reference" >/dev/null
                test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$reference")" = linux/amd64
                echo "Reusing the immutable run-specific candidate: $reference"
                printf '%s\t%s\n' "$image_name" "$service" >> "$RUNNER_TEMP/hospital-candidates-existing.txt"
                ;;
              absent)
                printf '%s\t%s\n' "$image_name" "$service" >> "$RUNNER_TEMP/hospital-candidates-missing.txt"
                ;;
              *) exit 1 ;;
            esac
          done < "$RUNNER_TEMP/hospital-release-images.tsv"
          if [ -s "$RUNNER_TEMP/hospital-candidates-existing.txt" ]; then
            test "$GITHUB_RUN_ATTEMPT" -gt 1 || {
              echo "Run-specific candidate exists without evidence from a prior attempt." >&2
              exit 1
            }
            evidence="$RUNNER_TEMP/hospital-prior-candidate-evidence"
            mkdir "$evidence"
            found=0
            attempt=$((GITHUB_RUN_ATTEMPT - 1))
            while [ "$attempt" -ge 1 ]; do
              artifact="hospital-$HOSPITAL_RELEASE-$GITHUB_RUN_ID-$attempt-security-evidence"
              ids="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
                --jq ".artifacts[] | select(.expired == false and .name == \"$artifact\") | .id")"
              if [ "$(printf '%s\n' "$ids" | grep -c . || true)" -gt 1 ]; then
                echo "Ambiguous prior evidence artifact: $artifact" >&2
                exit 1
              fi
              if [ -n "$ids" ]; then
                gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ids/zip" > "$evidence.zip"
                unzip -q "$evidence.zip" -d "$evidence"
                ledger="$(find "$evidence" -type f -name built-image-ledger.json -print)"
                proof="$(find "$evidence" -type f -name candidate-evidence.tsv -print)"
                postgres_provenance="$(find "$evidence" -type f -name postgres-source-provenance.json -print)"
                test "$(printf '%s\n' "$ledger" | grep -c . || true)" -eq 1
                test "$(printf '%s\n' "$proof" | grep -c . || true)" -eq 1
                test "$(printf '%s\n' "$postgres_provenance" | grep -c . || true)" -eq 1
                node scripts/release-image-evidence.mjs verify-prior "$HOSPITAL_RELEASE" "$ledger" \
                  "$postgres_provenance" "$proof"
                found=1
                break
              fi
              attempt=$((attempt - 1))
            done
            test "$found" -eq 1 || {
              echo "Existing candidates have no durable prior build/scan evidence." >&2
              exit 1
            }
            while read -r image_name service; do
              node scripts/release-image-evidence.mjs verify-portable \
                "$HOSPITAL_RELEASE" "$ledger" "$image_name"
            done < "$RUNNER_TEMP/hospital-candidates-existing.txt"
          fi

      - name: Build each missing custom candidate exactly once
        shell: bash
        run: |
          set -euo pipefail
          while read -r image_name service; do
            test -n "$image_name" && test -n "$service" || continue
            docker compose -f compose.yaml -f compose.publish.yaml --profile tools build "$service"
          done < "$RUNNER_TEMP/hospital-candidates-missing.txt"

      - name: Prove backup and restore with the exact candidate PostgreSQL image
        run: |
          POSTGRES_IMAGE="ghcr.io/kaloyandjunow-prog/lospor-hospital-postgres:$HOSPITAL_IMAGE_TAG" \
            sh scripts/test-backup-restore.sh

      - name: Prove legacy-volume compatibility with the exact candidate PostgreSQL image
        run: |
          sh infra/docker/postgres-cross-base-upgrade.test.sh \
            "ghcr.io/kaloyandjunow-prog/lospor-hospital-postgres:$HOSPITAL_IMAGE_TAG"

      - name: Record all ten pre-push image identities
        run: |
          mkdir -p .data/release-evidence
          node scripts/release-image-evidence.mjs create "$HOSPITAL_RELEASE" \
            .data/release-evidence/built-image-ledger.json

      - name: Extract and verify source-built PostgreSQL provenance
        run: |
          node scripts/postgres-source-provenance.mjs create \
            "ghcr.io/kaloyandjunow-prog/lospor-hospital-postgres:$HOSPITAL_IMAGE_TAG" \
            release-inputs.json .data/release-evidence/postgres-source-provenance
          node scripts/postgres-source-provenance.mjs require-vulnerability-review \
            "$HOSPITAL_RELEASE" release-inputs.json

      - name: Discard selected Buildx cache and builder after recording candidate identities
        shell: bash
        run: |
          set -euo pipefail
          test -s .data/release-evidence/built-image-ledger.json
          docker buildx prune --builder "${{ steps.buildx.outputs.name }}" --all --force
          docker buildx rm "${{ steps.buildx.outputs.name }}"

      - name: Scan all ten candidate images and create SBOM evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .data/trivy-cache .data/release-evidence/vulnerabilities .data/release-evidence/sboms
          custom_ref() { printf 'ghcr.io/kaloyandjunow-prog/lospor-hospital-%s:%s' "$1" "$HOSPITAL_IMAGE_TAG"; }
          scan() {
            name="$1"; reference="$2"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.data/trivy-cache:/root/.cache" \
              -v "$PWD/.data/release-evidence:/reports" \
              "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --format json \
              --output "/reports/vulnerabilities/$name.json" "$reference"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.data/trivy-cache:/root/.cache" \
              -v "$PWD/.data/release-evidence:/reports" \
              "$TRIVY_IMAGE" image --format cyclonedx \
              --output "/reports/sboms/$name.cdx.json" "$reference"
          }
          scan api "$(custom_ref api)"
          scan browser "$(custom_ref browser)"
          scan caddy "$(custom_ref caddy)"
          scan curl-worker "$(custom_ref curl-worker)"
          scan migrate "$(custom_ref migrate)"
          scan postgres "$(custom_ref postgres)"
          scan pwa "$(custom_ref pwa)"
          scan status "$(custom_ref status)"
          scan tools "$(custom_ref tools)"
          scan web "$(custom_ref web)"
          node scripts/release-image-evidence.mjs verify-scans "$HOSPITAL_RELEASE" \
            .data/release-evidence/built-image-ledger.json \
            .data/release-evidence/vulnerabilities/{api,browser,caddy,curl-worker,migrate,postgres,pwa,status,tools,web}.json \
            .data/release-evidence/sboms/{api,browser,caddy,curl-worker,migrate,postgres,pwa,status,tools,web}.cdx.json
          node scripts/verify-vulnerability-policy.mjs "$HOSPITAL_RELEASE" release-risk-exceptions.json \
            .data/release-evidence/vulnerabilities/{api,browser,caddy,curl-worker,migrate,postgres,pwa,status,tools,web}.json
          node scripts/release-image-evidence.mjs mark-policy-passed "$HOSPITAL_RELEASE" \
            .data/release-evidence/built-image-ledger.json \
            .data/release-evidence/postgres-source-provenance/postgres-source-provenance.json \
            .data/release-evidence/candidate-evidence.tsv

      - name: Upload scan evidence even when policy blocks the release
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hospital-${{ needs.metadata.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-security-evidence
          path: .data/release-evidence
          if-no-files-found: error

      - name: Delete scanner cache and its non-release image
        shell: bash
        run: |
          set -euo pipefail
          scanner_id="$(docker image inspect --format '{{.Id}}' "$TRIVY_IMAGE")"
          node -e '
            const ledger = require("./.data/release-evidence/built-image-ledger.json")
            if (ledger.images.some(image => image.localDockerId === process.argv[1])) {
              throw new Error("Refusing to delete a scanner image recorded in the release ledger")
            }
          ' "$scanner_id"
          cache_path="$(realpath .data/trivy-cache)"
          test "$cache_path" = "$GITHUB_WORKSPACE/.data/trivy-cache"
          sudo chown -R "$(id -u):$(id -g)" "$cache_path"
          rm -rf "$cache_path"
          test ! -e "$cache_path"
          docker image rm --force "$scanner_id"
          docker image prune --force

      - name: Establish resumable candidate state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r image_name service; do
            candidate="ghcr.io/kaloyandjunow-prog/lospor-hospital-$image_name:$HOSPITAL_IMAGE_TAG"
            tag_state="$(node scripts/ghcr-tag-state.mjs "$candidate" --allow-repository-absent)"
            case "$tag_state" in
              exists)
                docker pull --platform linux/amd64 "$candidate" >/dev/null
                node scripts/release-image-evidence.mjs verify-local "$HOSPITAL_RELEASE" \
                  ./.data/release-evidence/built-image-ledger.json "$image_name"
                echo "Reusing exact candidate already stored in GHCR: $candidate"
                ;;
              absent) ;;
              *) exit 1 ;;
            esac
          done < "$RUNNER_TEMP/hospital-release-images.tsv"

      - name: Push only missing run-specific private candidates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while read -r image_name service; do
            test -n "$image_name" && test -n "$service" || continue
            reference="ghcr.io/kaloyandjunow-prog/lospor-hospital-$image_name:$HOSPITAL_IMAGE_TAG"
            tag_state="$(node scripts/ghcr-tag-state.mjs "$reference" --allow-repository-absent)"
            case "$tag_state" in
              exists)
                docker pull --platform linux/amd64 "$reference" >/dev/null
                node scripts/release-image-evidence.mjs verify-local "$HOSPITAL_RELEASE" \
                  ./.data/release-evidence/built-image-ledger.json "$image_name"
                ;;
              absent)
                node scripts/release-image-evidence.mjs verify-local "$HOSPITAL_RELEASE" \
                  ./.data/release-evidence/built-image-ledger.json "$image_name"
                docker push "$reference"
                ;;
              *) exit 1 ;;
            esac
          done < "$RUNNER_TEMP/hospital-candidates-missing.txt"

      - name: Remove local candidates and re-pull exact registry identities
        shell: bash
        run: |
          set -euo pipefail
          while read -r image_name service; do
            docker image rm "ghcr.io/kaloyandjunow-prog/lospor-hospital-$image_name:$HOSPITAL_IMAGE_TAG"
          done < "$RUNNER_TEMP/hospital-release-images.tsv"
          mkdir -p dist
          export HOSPITAL_MIGRATOR_IMMUTABLE_OUTPUT="$RUNNER_TEMP/hospital-migrator-immutable.txt"
          node scripts/create-image-lock.mjs "$HOSPITAL_RELEASE" "dist/lospor-hospital-$HOSPITAL_RELEASE-images.json"
          node scripts/release-image-evidence.mjs verify-lock "$HOSPITAL_RELEASE" \
            .data/release-evidence/built-image-ledger.json \
            "dist/lospor-hospital-$HOSPITAL_RELEASE-images.json"
          node scripts/image-lock.mjs verify-loaded-lock "dist/lospor-hospital-$HOSPITAL_RELEASE-images.json" "$HOSPITAL_RELEASE"
          node scripts/image-lock.mjs refs "dist/lospor-hospital-$HOSPITAL_RELEASE-images.json" "$HOSPITAL_RELEASE" \
            | cut -f1 \
            | while IFS= read -r reference; do docker image inspect --format '{{.Id}}' "$reference"; done \
            | sort -u > "$RUNNER_TEMP/hospital-locked-local-ids.txt"
          test -s "$RUNNER_TEMP/hospital-locked-local-ids.txt"

      - name: Test migrations with the exact re-pulled candidate image
        shell: bash
        run: |
          set -euo pipefail
          MIGRATOR_IMAGE="$(cat "$RUNNER_TEMP/hospital-migrator-immutable.txt")" \
          POSTGRES_IMAGE="$HOSPITAL_IMAGE_REGISTRY/lospor-hospital-postgres:$HOSPITAL_RELEASE" \
            sh scripts/test-migrator-image.sh

      - name: Reclaim only images outside the verified release lock
        shell: bash
        run: |
          set -euo pipefail
          lock="dist/lospor-hospital-$HOSPITAL_RELEASE-images.json"
          node scripts/image-lock.mjs verify-loaded-lock "$lock" "$HOSPITAL_RELEASE"
          mapfile -t locked_ids < "$RUNNER_TEMP/hospital-locked-local-ids.txt"
          test "${#locked_ids[@]}" -ge 1
          local_ids_output="$(docker image ls --all --no-trunc --quiet | sort -u)"
          mapfile -t local_ids <<< "$local_ids_output"
          for image_id in "${local_ids[@]}"; do
            keep=0
            for locked_id in "${locked_ids[@]}"; do
              if [ "$image_id" = "$locked_id" ]; then
                keep=1
                break
              fi
            done
            if [ "$keep" -eq 0 ]; then
              docker image rm --force "$image_id"
            fi
          done
          docker image prune --force
          node scripts/image-lock.mjs verify-loaded-lock "$lock" "$HOSPITAL_RELEASE"

      - name: Build deployment kit and split offline bundle from tested identities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-distribution-boundaries.mjs
          sh scripts/create-deployment-kit.sh "$HOSPITAL_RELEASE"
          bash scripts/bundle-offline.sh "$HOSPITAL_RELEASE" "dist/lospor-hospital-$HOSPITAL_RELEASE-images.json"
          cp "dist/lospor-hospital-$HOSPITAL_RELEASE-images.json" .data/release-evidence/image-lock.json
          cp release-risk-exceptions.json .data/release-evidence/risk-exceptions.json
          tar -C .data -czf "dist/lospor-hospital-$HOSPITAL_RELEASE-security-evidence.tar.gz" release-evidence

      - name: Create canonical JSON manifest and host-verifiable release lock
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --version "$HOSPITAL_RELEASE"
            --commit "$GITHUB_SHA"
            --createdAt "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
            --images "dist/lospor-hospital-$HOSPITAL_RELEASE-images.json"
            --deployment "dist/lospor-hospital-$HOSPITAL_RELEASE-deployment.tar.gz"
            --evidence "dist/lospor-hospital-$HOSPITAL_RELEASE-security-evidence.tar.gz"
            --upstream UPSTREAM_VERSIONS.json
            --output "dist/lospor-hospital-$HOSPITAL_RELEASE-manifest.json"
          )
          while IFS= read -r part; do args+=(--offline-part "$part"); done \
            < <(find dist -maxdepth 1 -type f -name "lospor-hospital-$HOSPITAL_RELEASE-images.tar.gz.part-*" | sort)
          node scripts/create-release-manifest.mjs "${args[@]}"
          node scripts/create-release-lock.mjs \
            "dist/lospor-hospital-$HOSPITAL_RELEASE-manifest.json" \
            "dist/lospor-hospital-$HOSPITAL_RELEASE-release.lock"

      - name: Create the canonical lock checksum and publication request
        shell: bash
        run: |
          set -euo pipefail
          lock="dist/lospor-hospital-$HOSPITAL_RELEASE-release.lock"
          lock_name="$(basename "$lock")"
          lock_sha256="$(sha256sum "$lock" | awk '{print $1}')"
          printf '%s  %s\n' "$lock_sha256" "$lock_name" > "$lock.sha256"
          (cd dist && sha256sum --check --strict "$lock_name.sha256")
          node scripts/create-release-handoff.mjs \
            "$HOSPITAL_RELEASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$lock" \
            "dist/lospor-hospital-$HOSPITAL_RELEASE-publication-request.tsv"
          node scripts/verify-release-handoff.mjs \
            "dist/lospor-hospital-$HOSPITAL_RELEASE-publication-request.tsv" \
            "$lock" \
            "$HOSPITAL_RELEASE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          node scripts/verify-release-candidate.mjs "$HOSPITAL_RELEASE" dist candidate-assets "$GITHUB_SHA"

      - name: Prove the exact candidate through a verified release transition
        shell: bash
        env:
          HOSPITAL_ALLOW_UNSUPPORTED_TEST_HOST: "1"
          HOSPITAL_CREDENTIAL_TEST_ONLY: "1"
          HOSPITAL_RELEASE_TEST_ONLY: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prefix="lospor-hospital-$HOSPITAL_RELEASE"
          bootstrap="$RUNNER_TEMP/hospital-candidate-online/bootstrap"
          home="$RUNNER_TEMP/hospital-candidate-online/home"
          mkdir -p "$bootstrap/scripts" "$home"
          for script in activate-verified-release.sh installed-release-state.sh operator-locale.sh provision-update-credentials.sh run-online-release.sh update-pipeline-lib.sh verify-loaded-release-images.sh verify-release.sh; do
            cp "scripts/$script" "$bootstrap/scripts/$script"
          done
          ln -s "$home" "$bootstrap/.lospor-home"
          # The connected update path needs this site's own read-only GHCR
          # credential (provision-update-credentials.sh); the freshly created
          # sandbox starts with none. Provision it from this job's own
          # GH_TOKEN, which already has packages:read on this registry -- the
          # same identity docker/login-action authenticated with above.
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GH_TOKEN" \
            | sh "$bootstrap/scripts/provision-update-credentials.sh" ghcr
          sh "$bootstrap/scripts/run-online-release.sh" \
            "dist/$prefix-release.lock" "dist/$prefix-release.lock.sha256" dist -- \
            sh -c 'set -e; sudo -E sh scripts/test-install.sh; ln -s "$LOSPOR_APPLIANCE_HOME/.env" .env'
          test -L "$home/current"
          grep -Eq "^LOSPOR-HOSPITAL-INSTALLED-RELEASE-V1[[:space:]]+$HOSPITAL_RELEASE[[:space:]]" \
            "$home/.data/installed-release.tsv"

      - name: Upload the release candidate for manual publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hospital-${{ needs.metadata.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: dist
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Summarise the candidate identity
        shell: bash
        run: |
          set -euo pipefail
          lock="dist/lospor-hospital-$HOSPITAL_RELEASE-release.lock"
          {
            echo "### Hospital $HOSPITAL_RELEASE candidate"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- candidate run: $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            echo "- release.lock SHA-256: $(sha256sum "$lock" | awk '{print $1}')"
            echo
            echo "No final image tags or GitHub Release were published. Review this exact lock hash, then run the manual publication workflow."
          } >> "$GITHUB_STEP_SUMMARY"
