# CI publication overlay.
#
# This file intentionally adds image names without removing the build
# definitions inherited from compose.yaml. The release workflow builds all ten
# images once, scans them, and only then pushes the exact versioned tags.
# Client installations use compose.release.yaml instead; that overlay removes
# every build definition so a hospital never compiles its own release.
#
# HOSPITAL_IMAGE_TAG is required by the release workflow. A tag-triggered
# release first uses candidate-<full-commit>-<workflow-run>-<build-input-hash>,
# tests the registry digests behind it, and only then promotes those same
# digests to the final version. Rerun attempts reuse that namespace and never
# rebuild an image that is already present unless an approved base input changed.
#
# Each built image is labelled with the fingerprint of its build inputs
# (scripts/image-reuse.mjs). A later release whose inputs for that image are
# unchanged takes the published image instead of rebuilding it; an image built
# outside the release workflow is labelled "unrecorded" and is never reused.

services:
  postgres:
    image: ghcr.io/kaloyandjunow-prog/lospor-hospital-postgres:${HOSPITAL_IMAGE_TAG:?HOSPITAL_IMAGE_TAG is required}
    build:
      labels:
        org.lospor.hospital.input-fingerprint: ${HOSPITAL_INPUT_FP_POSTGRES:-unrecorded}

  migrate:
    image: ghcr.io/kaloyandjunow-prog/lospor-hospital-migrate:${HOSPITAL_IMAGE_TAG:?HOSPITAL_IMAGE_TAG is required}
    build:
      labels:
        org.lospor.hospital.input-fingerprint: ${HOSPITAL_INPUT_FP_MIGRATE:-unrecorded}

  api:
