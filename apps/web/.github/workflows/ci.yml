name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:crossapp-ci
      - run: npx tsc --noEmit --pretty false
      - run: npm run verify:boundaries
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The end-to-end suite covers both role workflows and the two-client clinical
  # path. The latter alternates Web and the exported phone PWA across a complete
  # synthetic intraoperative hour, so a release cannot treat test discovery as
  # evidence that cross-device writes, conflicts, replay and projections work.
  #
  # It needs the API and Mobile beside it because the specs drive both real
  # clients through the API rather than mocks. Both companions are taken from
  # main: a pull request here is tested against the versions it could actually
  # integrate with. Coordinated changes therefore stay red until their
  # companion repositories land; pinned Hospital combinations are imported and
  # tested separately by the appliance release gate.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # Playwright and scripts/e2e-db.mjs both read this. Without it they fell
      # back to 127.0.0.1:55433, the local Docker container, which does not
      # exist on a runner — so the suite ran against the service on 5432 while
      # the seeder talked to nothing.
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      LOSPOR_AUTH_SECRET: ci-only-not-used-for-production
      NEXTAUTH_SECRET: ci-only-not-used-for-production
      NEXTAUTH_URL: http://localhost:3000
      LOSPOR_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      LOSPOR_API_INTERNAL_URL: http://localhost:3002
      AUTH_EMAIL_TEST_LINKS: "true"
      BREVO_API_KEY: ""
      E2E_DISABLE_MOBILE_REDIRECT: "true"
      # The crossapp specs assert on wall-clock labels the app renders in the
      # browser's local timezone (e.g. a "09:00" timetable slot) against cases
      # whose synthetic times are written as Europe/Sofia instants. That only
      # ever matched by coincidence on a developer machine already set to that
      # zone. GitHub's runners default to UTC, so those same instants render
      # three hours earlier and the expected label never appears. Every
      # process here -- Node, and the Chromium the crossapp specs drive --
      # reads TZ, so setting it once covers all of them without threading a
      # per-context timezoneId through every manually created browser context.
      TZ: Europe/Sofia
    steps:
      # Checked out as siblings: playwright.config.ts starts the API with
      # `npm --prefix ../lospor-api run dev`, so the layout has to match a
      # developer's working copy.
      - uses: actions/checkout@v6
        with:
          path: lospor-app
      - uses: actions/checkout@v6
        with:
          repository: kaloyandjunow-prog/lospor-api
          ref: main
          path: lospor-api
      - uses: actions/checkout@v6
        with:
          repository: kaloyandjunow-prog/lospor-mobile
          ref: main
          path: lospor-mobile
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci
        working-directory: lospor-app
      - run: npm ci
        working-directory: lospor-api
      - run: npm ci
        working-directory: lospor-mobile

      - name: Prepare the database
        working-directory: lospor-api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Install Playwright
        working-directory: lospor-app
        run: npx playwright install --with-deps chromium

      # No seed step here on purpose. e2e/global-setup.ts runs the same seeder
      # before every Playwright run, so a step here only made the same work
      # happen twice and gave two places to keep in step.
      - name: End-to-end suite
        working-directory: lospor-app
        run: npm run e2e

      - name: Two-client one-hour intraoperative release gate
        working-directory: lospor-app
        run: npm run e2e:crossapp -- e2e/intraop-across-apps.crossapp.spec.ts

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-diagnostics
          path: |
            lospor-app/playwright-report
            lospor-app/test-results
          if-no-files-found: ignore
