name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --pretty false
      - run: npm run verify:boundaries
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The end-to-end suite covers the rules that only appear when two people are
  # in the room: who may see a case, who may approve a move into a department,
  # what a head of department is shown. Those had been running on one
  # developer's machine and nowhere else, so a pull request could break them
  # and nothing would say so until the release gate — after production.
  #
  # It needs the API beside it, because the specs drive the real endpoints
  # through the web app's proxy rather than a mock. The API is taken from main:
  # a pull request here is a change to the web app, tested against the API as it
  # currently stands. Pinned combinations are the release gate's job.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # Playwright and scripts/e2e-db.mjs both read this. Without it they fell
      # back to 127.0.0.1:55433, the local Docker container, which does not
      # exist on a runner — so the suite ran against the service on 5432 while
      # the seeder talked to nothing.
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      LOSPOR_AUTH_SECRET: ci-only-not-used-for-production
      NEXTAUTH_SECRET: ci-only-not-used-for-production
      NEXTAUTH_URL: http://localhost:3000
      LOSPOR_WEB_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      LOSPOR_API_INTERNAL_URL: http://localhost:3002
      AUTH_EMAIL_TEST_LINKS: "true"
      BREVO_API_KEY: ""
      E2E_DISABLE_MOBILE_REDIRECT: "true"
    steps:
      # Checked out as siblings: playwright.config.ts starts the API with
      # `npm --prefix ../lospor-api run dev`, so the layout has to match a
      # developer's working copy.
      - uses: actions/checkout@v6
        with:
          path: lospor-app
      - uses: actions/checkout@v6
        with:
          repository: kaloyandjunow-prog/lospor-api
          ref: main
          path: lospor-api
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci
        working-directory: lospor-app
      - run: npm ci
        working-directory: lospor-api

      - name: Prepare the database
        working-directory: lospor-api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Install Playwright
        working-directory: lospor-app
        run: npx playwright install --with-deps chromium

      # No seed step here on purpose. e2e/global-setup.ts runs the same seeder
      # before every Playwright run, so a step here only made the same work
      # happen twice and gave two places to keep in step.
      - name: End-to-end suite
        working-directory: lospor-app
        run: npm run e2e

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-diagnostics
          path: |
            lospor-app/playwright-report
            lospor-app/test-results
          if-no-files-found: ignore
