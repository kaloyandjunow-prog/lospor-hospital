name: lospor-hospital

x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# Applied to every service. Three of them carried this and the rest did not,
# which is the worst arrangement: the containers holding clinical data and
# terminating TLS were the unhardened ones.
#
# Services that genuinely need a capability add it back explicitly and say why.
# `read_only` is the part that most often needs a tmpfs alongside it, so each
# service declares the paths it actually writes.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-postgres-build: &postgres-build
  context: .
  dockerfile: infra/docker/postgres.Dockerfile
  args:
    POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-postgres:17.11-bookworm}

x-api-environment: &api-environment
  NODE_ENV: production
  # Pediatric charting is a fixed Hospital product capability. The independent
  # adult/pediatric guidance policies below control only prospective calculated
  # entry assistance and must never disable manual pediatric documentation.
  PEDIATRIC_MODE_ENABLED: "true"
  LOSPOR_DEPLOYMENT_MODE: hospital
  LOSPOR_ACCOUNT_ADMINISTRATION_ENABLED: "true"
  LOSPOR_ADMIN_MFA_REQUIRED: "true"
  LOSPOR_MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa-encryption-key
  LOSPOR_DEFAULT_LOCALE: ${LOSPOR_DEFAULT_LOCALE:-bg}
  HOSPITAL_APPLIANCE_RELEASE: ${HOSPITAL_RELEASE:-source}
  # The running API connects as lospor_app, which can read and write application
  # rows and nothing else (infra/postgres/create-app-role.sh). Migrations and the
  # operator tools override these with the owning lospor role below.
  DATABASE_URL: postgresql://lospor_app:${HOSPITAL_POSTGRES_APP_PASSWORD}@postgres:5432/lospor
  DIRECT_URL: postgresql://lospor_app:${HOSPITAL_POSTGRES_APP_PASSWORD}@postgres:5432/lospor
  LOSPOR_AUTH_SECRET: ${LOSPOR_AUTH_SECRET}
  NEXTAUTH_SECRET: ${LOSPOR_AUTH_SECRET}
  LOSPOR_WEB_URL: https://${HOSPITAL_CLINICAL_DOMAIN}
  NEXT_PUBLIC_APP_URL: https://${HOSPITAL_CLINICAL_DOMAIN}
  LOSPOR_SUPPORT_URL: ${HOSPITAL_SUPPORT_URL:-}
  LOSPOR_DATABASE_URL: https://${HOSPITAL_RESEARCH_DOMAIN}
  # The phone app is now same-origin with the web app and the API, so it needs
  # no cross-origin grant at all. Research is the only other origin left.
  CORS_ALLOW_ORIGIN: https://${HOSPITAL_CLINICAL_DOMAIN}
  CORS_ALLOW_ORIGINS: https://${HOSPITAL_CLINICAL_DOMAIN},https://${HOSPITAL_RESEARCH_DOMAIN}
  HOSPITAL_REQUIRE_PATIENT_NUMBER: "true"
  HOSPITAL_ADULT_GUIDANCE_DEFAULT: ${HOSPITAL_ADULT_GUIDANCE_DEFAULT:-true}
  HOSPITAL_PEDIATRIC_GUIDANCE_DEFAULT: ${HOSPITAL_PEDIATRIC_GUIDANCE_DEFAULT:-true}
  HOSPITAL_EXTERNAL_AI_DEFAULT: ${HOSPITAL_EXTERNAL_AI_DEFAULT:-true}
  HOSPITAL_EXTERNAL_AI_SEAL_KEY_FILE: /run/secrets/external-ai-seal-key
  HOSPITAL_EHR_TRANSPORT_SEAL_KEY_FILE: /run/secrets/ehr-transport-seal-key
  HOSPITAL_PATIENT_HMAC_KEY: ${HOSPITAL_PATIENT_HMAC_KEY}
  HOSPITAL_PATIENT_ENCRYPTION_KEY: ${HOSPITAL_PATIENT_ENCRYPTION_KEY}
  HOSPITAL_EXPORT_PSEUDONYM_KEY: ${HOSPITAL_EXPORT_PSEUDONYM_KEY}
  HOSPITAL_EXPORT_DIR: /var/lib/lospor/central-exports
  HOSPITAL_EHR_DIR: /var/lib/lospor/ehr-exchange
  # The adapter fetches the printable record from the web container directly
  # rather than through the public domain: it works before TLS is configured,
  # does not depend on the reverse proxy, and the document never leaves the
  # appliance on its way between two containers.
  LOSPOR_WEB_INTERNAL_URL: http://web:3000
  HOSPITAL_EXPORT_BATCH_CASE_LIMIT: ${HOSPITAL_EXPORT_BATCH_CASE_LIMIT:-500}
  HOSPITAL_EXPORT_RETAIN_ACCEPTED_DAYS: ${HOSPITAL_EXPORT_RETAIN_ACCEPTED_DAYS:-7}
  HOSPITAL_SITE_SIGNING_PRIVATE_KEY_FILE: /run/secrets/site-signing-private.pem
  HOSPITAL_SITE_SIGNING_PUBLIC_KEY_FILE: /run/secrets/site-signing-public.pem
  HOSPITAL_SITE_SIGNING_KEY_ID: ${HOSPITAL_SITE_SIGNING_KEY_ID:-hospital-ed25519-1}
  HOSPITAL_MTLS_CERT_FILE: /run/secrets/site-client-cert.pem
  HOSPITAL_MTLS_KEY_FILE: /run/secrets/site-client-key.pem
  HOSPITAL_MTLS_CA_FILE: /run/secrets/central-ca.pem
  HOSPITAL_WORKER_TOKEN: ${HOSPITAL_WORKER_TOKEN}
  HOSPITAL_WORKER_TOKEN_PREVIOUS: ${HOSPITAL_WORKER_TOKEN_PREVIOUS:-}
  RESEARCH_EXPORT_STORAGE_DRIVER: filesystem
  RESEARCH_EXPORT_STORAGE_DIR: /var/lib/lospor/research-exports
  RESEARCH_EXPORT_WORKER_SECRET: ${RESEARCH_EXPORT_WORKER_SECRET}
  RESEARCH_EXPORT_WORKER_SECRET_PREVIOUS: ${RESEARCH_EXPORT_WORKER_SECRET_PREVIOUS:-}
  RESEARCH_EXPORT_RETENTION_DAYS: ${RESEARCH_EXPORT_RETENTION_DAYS:-30}
  OMOP_PSEUDONYM_SALT: ${OMOP_PSEUDONYM_SALT}
  CRON_SECRET: ${CRON_SECRET}
  CRON_SECRET_PREVIOUS: ${CRON_SECRET_PREVIOUS:-}
  OPTION_LIBRARY_SNAPSHOT_SECRET: ${OPTION_LIBRARY_SNAPSHOT_SECRET}
  OPTION_LIBRARY_SNAPSHOT_SECRET_PREVIOUS: ${OPTION_LIBRARY_SNAPSHOT_SECRET_PREVIOUS:-}
  HOSPITAL_STATUS_SNAPSHOT_TOKEN_FILE: /run/status-secrets/snapshot-token
  HOSPITAL_STATUS_ACCOUNT_CONTROL_TOKEN_FILE: /run/status-secrets/account-control-token
  HOSPITAL_STATUS_EVENT_URL: http://status:3004/internal/events
  HOSPITAL_STATUS_EVENT_TOKEN_FILE: /run/status-secrets/api-event-token
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  # No default sender. It used to fall back to no-reply@lospor.org, so a site
  # that configured a mail key but no sender would send hospital account mail as
  # the public project domain -- unsigned by SPF or DKIM for that domain, and
  # attributed to someone who did not send it. Empty is the safe value: nothing
  # sends until the site states who it is.
  AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
  AUTH_EMAIL_FROM_NAME: ${AUTH_EMAIL_FROM_NAME:-LOSPOR}

services:
  runtime-secrets-init:
    image: ${POSTGRES_IMAGE:-lospor-hospital-postgres:source}
    build: *postgres-build
    user: "0:0"
    restart: "no"
    environment:
      STATUS_SECRET_SOURCE: /source/status
      API_SECRET_SOURCE: /source/api
      STATUS_SECRET_TARGET: /target/status
      API_SECRET_TARGET: /target/api
      API_STATUS_SECRET_TARGET: /target/api-status
      # curl_user in the worker image. Owning the signals directory is what lets
      # that container stop running as root.
      SIGNALS_TARGET: /target/signals
      SIGNALS_UID: 100
      SIGNALS_GID: 101
      UPDATE_REQUESTS_TARGET: /target/update/requests
      UPDATE_STATE_TARGET: /target/update/state
    volumes:
      - ./infra/secrets/install-runtime-secrets.sh:/usr/local/bin/install-runtime-secrets.sh:ro
      - ./secrets/status:/source/status:ro
      - ./secrets/api:/source/api:ro
      - status-runtime-secrets:/target/status
      - api-runtime-secrets:/target/api
      - api-status-runtime-secrets:/target/api-status
      - status-signals:/target/signals
      # Host paths, not volumes. ./.data is a symlink to the appliance home's
      # runtime directory, so this outlives the containers -- which matters
      # because applying an update runs `docker compose down`, and a request
      # recorded in a volume would be lost at exactly the moment it is needed.
      - ./.data/update/requests:/target/update/requests
      - ./.data/update/state:/target/update/state
    entrypoint: ["/bin/sh", "/usr/local/bin/install-runtime-secrets.sh"]
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop: [ALL]
    # One-shot only: read host-owned 0600 sources, set named-volume modes, and
    # assign the copied files to the unprivileged runtime UID.
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    network_mode: none
    logging: *service-logging

  postgres:
    image: ${POSTGRES_IMAGE:-lospor-hospital-postgres:source}
    build: *postgres-build
    restart: unless-stopped
    environment:
      POSTGRES_DB: lospor
      POSTGRES_USER: lospor
      POSTGRES_PASSWORD: ${HOSPITAL_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    # Version 1.0.0 intentionally uses verified daily dumps, not an unbounded
    # local WAL archive. The supported recovery point is the newest completed
    # dump copied to the hospital's encrypted off-host backup system.
    #
    # The rest is tuning. The installer requires 16 GiB and PostgreSQL was
    # running on defaults sized for a machine a fraction of that: 128 MB of
    # shared buffers, and a planner assuming spinning disks. These values follow
    # the 4 GiB ceiling set below -- raise both together or neither.
    command:
      - postgres
      - -c
      - archive_mode=off
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      # Per sort or hash, not per connection, and max_connections is 100. Kept
      # deliberately modest: a single bad research query can otherwise multiply
      # this by every parallel operation it starts.
      - -c
      - work_mem=8MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      # The appliance specifies SSD storage, where a random read costs close to
      # a sequential one. The default of 4.0 describes a disk that has to seek.
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Parallel query allocates through /dev/shm, which Docker caps at 64 MB by
    # default -- small enough to fail a large research query for reasons that
    # look nothing like their cause.
    shm_size: 1gb
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lospor -d lospor"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/run/postgresql:size=16m,mode=0755,uid=999,gid=999
    cap_drop: [ALL]
    # The image replaces the usual `gosu postgres` with `chroot --userspec`, so
    # starting the server needs SYS_CHROOT and the two SET*ID capabilities on
    # top of the ownership ones initdb uses on a fresh data volume. Everything
    # else the default set grants -- raw sockets, mknod, ptrace -- is dropped.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, SYS_CHROOT]
    security_opt: [no-new-privileges:true]
    logging: *service-logging
    networks: [backend, monitoring]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: migrator
      args:
        NODE_API_BASE_IMAGE: ${NODE_API_BASE_IMAGE:-node:24-alpine3.24}
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://lospor:${HOSPITAL_POSTGRES_PASSWORD}@postgres:5432/lospor
      DIRECT_URL: postgresql://lospor:${HOSPITAL_POSTGRES_PASSWORD}@postgres:5432/lospor
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: *hardening
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 1g
    networks: [backend]

  status-db-init:
    profiles: [tools]
    image: ${POSTGRES_IMAGE:-lospor-hospital-postgres:source}
    build: *postgres-build
    # Reads the probe secret from the runtime volume, as every other service
    # does, rather than through Compose `secrets:`. Local secrets are bind
    # mounts that keep host ownership, and this one-shot runs with cap_drop:
    # [ALL] -- which removes DAC_OVERRIDE, so root could stat the 0600 file and
    # not read it. `test -s` passed and the read failed one line later.
    #
    # runtime-secrets-init already materialises db-probe-password as 0400 owned
    # by 1001, and install.sh runs it first. This was the last service still
    # taking the host copy, so the mechanism leaves the appliance with it.
    user: "1001:1001"
    environment:
      POSTGRES_DB: lospor
      POSTGRES_USER: lospor
      PGPASSWORD: ${HOSPITAL_POSTGRES_PASSWORD}
      STATUS_POSTGRES_PROBE_PASSWORD_FILE: /run/status-secrets/db-probe-password
    volumes:
      - ./infra/postgres/create-status-probe.sh:/usr/local/bin/create-status-probe.sh:ro
      - status-runtime-secrets:/run/status-secrets:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/create-status-probe.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: *hardening
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    networks: [backend]

  # Creates or updates the API's restricted database role and its grants, after
  # migrations and before the API, on every start. See create-app-role.sh.
  db-app-role-init:
    image: ${POSTGRES_IMAGE:-lospor-hospital-postgres:source}
    build: *postgres-build
    environment:
      POSTGRES_DB: lospor
      POSTGRES_USER: lospor
      PGPASSWORD: ${HOSPITAL_POSTGRES_PASSWORD}
      HOSPITAL_POSTGRES_APP_PASSWORD: ${HOSPITAL_POSTGRES_APP_PASSWORD}
    volumes:
      - ./infra/postgres/create-app-role.sh:/usr/local/bin/create-app-role.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/create-app-role.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    <<: *hardening
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: runner
      args:
        NODE_API_BASE_IMAGE: ${NODE_API_BASE_IMAGE:-node:24-alpine3.24}
    restart: unless-stopped
    environment:
      <<: *api-environment
      # The certificate authority for connections the appliance makes *out*.
      #
      # Hospitals sign their internal servers with their own authority, so
      # without this a connection to their EHR is refused for want of
      # recognising a certificate rather than for any failure of encryption --
      # which reads from outside as "LOSPOR cannot do HTTPS" and ends with the
      # integration configured in plaintext, putting the hospital's own
      # integration password on the wire. The file is the one the installer
      # already asks for.
      #
      # Set here rather than on the shared anchor: migrate and tools inherit
      # that anchor and neither mounts this volume, so they would warn on every
      # run about a path that is not there.
      #
      # Node extends its built-in roots rather than replacing them, so public
      # certificates keep working. Always present, empty where a site has no
      # private authority -- a missing path warns on every boot.
      NODE_EXTRA_CA_CERTS: /run/secrets/hospital-ca.pem
    volumes:
      - central-exports:/var/lib/lospor/central-exports
      - research-exports:/var/lib/lospor/research-exports
      # A bind mount rather than a named volume: the hospital system has to be
      # able to write into this directory, and nothing outside Docker can reach
      # a named volume. A site points it at whatever its own integration uses —
      # commonly an SMB share the hospital already mounts on the host.
      - ${HOSPITAL_EHR_EXCHANGE_PATH:-./.data/ehr-exchange}:/var/lib/lospor/ehr-exchange
      # Only the API/Central allowlist and three scoped transport tokens are mounted
      # here. The rest of the Status secrets live in a disjoint runtime volume
      # and are never exposed to a compromised clinical API container.
      - api-runtime-secrets:/run/secrets:ro
      - api-status-runtime-secrets:/run/status-secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      db-app-role-init:
        condition: service_completed_successfully
      runtime-secrets-init:
        condition: service_completed_successfully
    <<: *hardening
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 2g
    logging: *service-logging
    networks: [backend, application, monitoring]

  delivery-worker:
    image: ${CURL_WORKER_IMAGE:-lospor-hospital-curl-worker:source}
    build:
      context: .
      dockerfile: infra/docker/curl-worker.Dockerfile
      args:
        CURL_BASE_IMAGE: ${CURL_BASE_IMAGE:-curlimages/curl:8.21.0}
    restart: unless-stopped
    environment:
      HOSPITAL_WORKER_TOKEN: ${HOSPITAL_WORKER_TOKEN}
      # The retention route authenticates with CRON_SECRET, which the API has
      # always had and the worker never did -- which is why nothing could call
      # it on an appliance.
      CRON_SECRET: ${CRON_SECRET}
      HOSPITAL_SIGNALS_DIR: /signals
      HOSPITAL_DELIVERY_INTERVAL_SECONDS: 60
      HOSPITAL_RETENTION_INTERVAL_SECONDS: ${HOSPITAL_RETENTION_INTERVAL_SECONDS:-86400}
      HOSPITAL_CASE_CLOSE_INTERVAL_SECONDS: ${HOSPITAL_CASE_CLOSE_INTERVAL_SECONDS:-300}
    volumes:
      - ./infra/delivery/worker-loop.sh:/usr/local/bin/worker-loop.sh:ro
      - status-signals:/signals
    entrypoint: ["/bin/sh", "/usr/local/bin/worker-loop.sh"]
    # No `user: "0:0"`. The image ends on USER curl_user, and Compose overrode
    # it under a comment that said root was selected deliberately without ever
    # saying what needed it. What needed it was the signals volume: root-owned
    # and 0755, so no other UID could publish a status file there.
    #
    # runtime-secrets-init hands that directory to this worker's UID, so the
    # container can now do its two jobs -- fetch two internal URLs, write a
    # signal file -- without being root to do either.
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully
    <<: *hardening
    mem_limit: 64m
    logging: *service-logging
    networks: [backend, monitoring]

  # The EHR adapter, off unless a site turns it on: `--profile ehr`.
  #
  # Reuses the curl image rather than adding an eleventh release image. All the
  # work happens in the API — this only decides when, twice per interval, and
  # the two calls are independent so neither direction can block the other.
  ehr-worker:
    profiles: [ehr]
    image: ${CURL_WORKER_IMAGE:-lospor-hospital-curl-worker:source}
    build:
      context: .
      dockerfile: infra/docker/curl-worker.Dockerfile
      args:
        CURL_BASE_IMAGE: ${CURL_BASE_IMAGE:-curlimages/curl:8.21.0}
    restart: unless-stopped
    environment:
      HOSPITAL_WORKER_TOKEN: ${HOSPITAL_WORKER_TOKEN}
      HOSPITAL_EHR_INTERVAL_SECONDS: ${HOSPITAL_EHR_INTERVAL_SECONDS:-60}
    volumes:
      - ./infra/delivery/ehr-worker-loop.sh:/usr/local/bin/ehr-worker-loop.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/ehr-worker-loop.sh"]
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully
    <<: *hardening
    mem_limit: 64m
    logging: *service-logging
    # backend only. This worker talks to the API and to nothing else — the
    # files it causes to be written are the API's business, and a transport
    # that needs egress gets its own network when it is built.
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NODE_WEB_BASE_IMAGE: ${NODE_WEB_BASE_IMAGE:-node:24-alpine3.24}
    restart: unless-stopped
    environment:
      LOSPOR_API_INTERNAL_URL: http://api:3002
      LOSPOR_DEFAULT_LOCALE: ${LOSPOR_DEFAULT_LOCALE:-bg}
      NEXT_PUBLIC_APP_URL: https://${HOSPITAL_CLINICAL_DOMAIN}
      MOBILE_PWA_URL: https://${HOSPITAL_CLINICAL_DOMAIN}/app
    depends_on:
      api:
        condition: service_healthy
    <<: *hardening
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1g
    logging: *service-logging
    networks: [application, monitoring]

  pwa:
    build:
      context: .
      dockerfile: infra/docker/pwa.Dockerfile
      args:
        NODE_PWA_BUILD_BASE_IMAGE: ${NODE_PWA_BUILD_BASE_IMAGE:-node:24-alpine3.24}
        NGINX_PWA_BASE_IMAGE: ${NGINX_PWA_BASE_IMAGE:-nginx:1.30.4-alpine}
    restart: unless-stopped
    read_only: true
    # nginx keeps its pid file and every proxy/client body buffer on disk. It
    # serves a static export here, so these only ever hold request bodies in
    # flight, but without them the master exits at startup.
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=64m,mode=0755
      - /var/run:size=8m,mode=0755
    cap_drop: [ALL]
    # The master starts as root to spawn workers as the nginx user; the listener
    # is 8080, so no NET_BIND_SERVICE is involved.
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *service-logging
    networks: [application, monitoring]

  browser:
    build:
      context: .
      dockerfile: infra/docker/browser.Dockerfile
      args:
        NODE_BROWSER_BASE_IMAGE: ${NODE_BROWSER_BASE_IMAGE:-node:24-alpine3.24}
    restart: unless-stopped
    environment:
      LOSPOR_API_INTERNAL_URL: http://api:3002
      LOSPOR_DEFAULT_LOCALE: ${LOSPOR_DEFAULT_LOCALE:-bg}
      LOSPOR_DATABASE_ORIGIN: https://${HOSPITAL_RESEARCH_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    <<: *hardening
    tmpfs:
      - /tmp:size=256m,mode=1777
    # The research workspace is where a heavy query lands. Without a ceiling it
    # could exhaust the host and take PostgreSQL and Status down with it, and
    # Status is the service that must survive a clinical outage.
    mem_limit: 2g
    logging: *service-logging
    networks: [application, monitoring]

  backup:
    image: ${POSTGRES_IMAGE:-lospor-hospital-postgres:source}
    build: *postgres-build
    restart: unless-stopped
    environment:
      POSTGRES_DB: lospor
      POSTGRES_USER: lospor
      PGPASSWORD: ${HOSPITAL_POSTGRES_PASSWORD}
      HOSPITAL_BACKUP_INTERVAL_SECONDS: ${HOSPITAL_BACKUP_INTERVAL_SECONDS:-14400}
      HOSPITAL_BACKUP_RETRY_SECONDS: ${HOSPITAL_BACKUP_RETRY_SECONDS:-300}
      HOSPITAL_BACKUP_KEEP_ALL_SECONDS: ${HOSPITAL_BACKUP_KEEP_ALL_SECONDS:-172800}
      HOSPITAL_BACKUP_DAILY_POINTS: ${HOSPITAL_BACKUP_DAILY_POINTS:-14}
      HOSPITAL_BACKUP_RESERVE_BYTES: ${HOSPITAL_BACKUP_RESERVE_BYTES:-5368709120}
      HOSPITAL_BACKUP_SPACE_MULTIPLIER_PERCENT: ${HOSPITAL_BACKUP_SPACE_MULTIPLIER_PERCENT:-150}
      HOSPITAL_BACKUP_SITE_ID: ${HOSPITAL_BACKUP_SITE_ID}
      HOSPITAL_BACKUP_APPLIANCE_ID: ${HOSPITAL_BACKUP_APPLIANCE_ID}
      HOSPITAL_APPLIANCE_RELEASE: ${HOSPITAL_RELEASE:-source}
      HOSPITAL_EXCHANGE_CONTRACT_VERSION: ${HOSPITAL_EXCHANGE_CONTRACT_VERSION:-2.5.0}
      HOSPITAL_DATA_DICTIONARY_VERSION: ${HOSPITAL_DATA_DICTIONARY_VERSION:-2.5.0}
      HOSPITAL_BACKUP_TOOL_VERSION: ${HOSPITAL_BACKUP_TOOL_VERSION:-source}
      HOSPITAL_PATIENT_HMAC_KEY_FINGERPRINT: ${HOSPITAL_PATIENT_HMAC_KEY_FINGERPRINT}
      HOSPITAL_PATIENT_ENCRYPTION_KEY_FINGERPRINT: ${HOSPITAL_PATIENT_ENCRYPTION_KEY_FINGERPRINT}
      HOSPITAL_EXPORT_PSEUDONYM_KEY_FINGERPRINT: ${HOSPITAL_EXPORT_PSEUDONYM_KEY_FINGERPRINT}
      HOSPITAL_OMOP_PSEUDONYM_SALT_FINGERPRINT: ${HOSPITAL_OMOP_PSEUDONYM_SALT_FINGERPRINT}
      HOSPITAL_SITE_SIGNING_KEY_FINGERPRINT: ${HOSPITAL_SITE_SIGNING_KEY_FINGERPRINT}
      HOSPITAL_EXTERNAL_AI_SEAL_KEY_FINGERPRINT: ${HOSPITAL_EXTERNAL_AI_SEAL_KEY_FINGERPRINT}
      HOSPITAL_MFA_ENCRYPTION_KEY_FINGERPRINT: ${HOSPITAL_MFA_ENCRYPTION_KEY_FINGERPRINT}
      HOSPITAL_BACKUP_MANIFEST_HMAC_KEY: ${HOSPITAL_BACKUP_MANIFEST_HMAC_KEY}
      HOSPITAL_BACKUP_OFFHOST_HOOK: /usr/local/bin/backup-offhost-hook
      HOSPITAL_SIGNALS_DIR: /signals
      HOSPITAL_IO_MUTATION_LOCK_FILE: /run/lospor/io-mutation.lock
    volumes:
      - ./infra/postgres/backup-loop.sh:/usr/local/bin/backup-loop.sh:ro
      - ./infra/postgres/backup-cycle.sh:/usr/local/bin/backup-cycle.sh:ro
      - ./infra/postgres/backup-once.sh:/usr/local/bin/backup-once.sh:ro
      - ./infra/postgres/backup-object-lib.sh:/usr/local/bin/backup-object-lib.sh:ro
      - ./infra/postgres/prune-backups.sh:/usr/local/bin/prune-backups.sh:ro
      - ./infra/postgres/restore.sh:/usr/local/bin/restore.sh:ro
      - ./secrets/backup/offhost-copy:/usr/local/bin/backup-offhost-hook:ro
      # In a versioned deployment `./.data` is the candidate's runtime-data
      # symlink, while the host update agent locks the appliance-home inode.
      # Resolve through the exported home so both processes lock exactly the
      # same physical file; source installs safely default to this directory.
      - ${LOSPOR_APPLIANCE_HOME:-.}/.data/io-mutation.lock:/run/lospor/io-mutation.lock
      - ./backups:/backups
      - status-signals:/signals
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-loop.sh"]
    # Spelled out rather than *hardening, because a service that adds a
    # capability states its whole posture where the addition is, instead of
    # leaving a reader to find the anchor to learn what it still drops.
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Kept because this is the service that writes where the appliance does not
    # own the destination.
    #
    # ./backups is created by the operator running the installer, mode 0700 and
    # owned by whoever that was; /signals belongs to the delivery worker's UID so
    # that container could stop running as root. This loop runs as root and used
    # to write to both by virtue of being root -- which stopped being true when
    # this release dropped every capability, DAC_OVERRIDE among them. Backups
    # then failed silently at the write, and the Status marker never appeared.
    #
    # Root cannot be dropped here for the same reason: the destination's owner is
    # a property of the host, so no UID chosen in this file is the right one.
    cap_add: [DAC_OVERRIDE]
    # pg_dump streams over the network and writes into the bind-mounted backups
    # directory, so only scratch space is needed here.
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 512m
    logging: *service-logging
    networks: [backend, monitoring]

  status:
    build:
      context: .
      dockerfile: infra/docker/status.Dockerfile
      args:
        NODE_STATUS_BASE_IMAGE: ${NODE_STATUS_BASE_IMAGE:-node:24-alpine3.24}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOSPOR_DEFAULT_LOCALE: ${LOSPOR_DEFAULT_LOCALE:-bg}
      HOSPITAL_RELEASE: ${HOSPITAL_RELEASE:-}
      STATUS_BASE_PATH: /status
      STATUS_DATABASE_PATH: /data/status.sqlite
      STATUS_HTTP_PORT: 3004
      STATUS_HTTPS_PORT: 3443
      STATUS_TLS_CERT_FILE: /run/status-secrets/fallback-cert.pem
      STATUS_TLS_KEY_FILE: /run/status-secrets/fallback-key.pem
      STATUS_EVENT_TOKENS_FILE: /run/status-secrets/event-tokens.json
      STATUS_RATE_LIMIT_KEY_FILE: /run/status-secrets/rate-limit-key
      STATUS_MFA_ENCRYPTION_KEY_FILE: /run/status-secrets/mfa-encryption-key
      STATUS_SNAPSHOT_TOKEN_FILE: /run/status-secrets/snapshot-token
      STATUS_ACCOUNT_CONTROL_TOKEN_FILE: /run/status-secrets/account-control-token
      STATUS_SIGNALS_DIR: /signals
      STATUS_UPDATE_REQUESTS_DIR: /update/requests
      STATUS_UPDATE_STATE_DIR: /update/state
      STATUS_API_LIVE_URL: http://api:3002/health/live
      STATUS_API_READY_URL: http://api:3002/health/ready
      STATUS_APPLIANCE_SNAPSHOT_URL: http://api:3002/internal/appliance-status
      STATUS_ACCOUNT_CONTROL_URL: http://api:3002/v1/internal/hospital/accounts
      STATUS_CONTROL_PLANE_URL: http://api:3002/v1/internal/hospital/control-plane
      STATUS_WEB_URL: http://web:3000/login
      STATUS_PWA_URL: http://pwa:8080/health
      STATUS_BROWSER_URL: http://browser:3003/login
      STATUS_CADDY_HOST: caddy
      STATUS_CADDY_PORT: 80
      STATUS_POSTGRES_HOST: postgres
      STATUS_POSTGRES_PORT: 5432
      STATUS_POSTGRES_DATABASE: lospor
      STATUS_POSTGRES_USER: lospor_status_probe
      STATUS_POSTGRES_PASSWORD_FILE: /run/status-secrets/db-probe-password
    ports:
      # The host port is configurable; the loopback binding is not. Publishing
      # the outage page to a LAN or a public interface is a security
      # regression, so the 127.0.0.1 prefix stays outside the variable where
      # nobody can drop it by setting a port.
      - "127.0.0.1:${HOSPITAL_STATUS_PORT:-3443}:3443"
    volumes:
      - status-data:/data
      - status-signals:/signals:ro
      - status-runtime-secrets:/run/status-secrets:ro
      # The only directory Status may write outside its own database. It asks
      # for a release or governed terminology operation here; it cannot apply
      # either -- it has no docker socket and runs unprivileged, which is the
      # property that makes a fixed-intent request channel safe in the first
      # place.
      - ./.data/update/requests:/update/requests
      # The agent's own state, read-only. Status reports what the agent is
      # doing and never edits it.
      - ./.data/update/state:/update/state:ro
    depends_on:
      runtime-secrets-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Status is what an operator reaches when the clinical stack is failing, so
    # it gets a small, guaranteed ceiling of its own rather than competing for
    # whatever the research workspace has left.
    mem_limit: 256m
    logging: *service-logging
    networks: [monitoring, status-fallback]

  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: tools
      args:
        NODE_API_BASE_IMAGE: ${NODE_API_BASE_IMAGE:-node:24-alpine3.24}
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://lospor:${HOSPITAL_POSTGRES_PASSWORD}@postgres:5432/lospor
      DIRECT_URL: postgresql://lospor:${HOSPITAL_POSTGRES_PASSWORD}@postgres:5432/lospor
    volumes:
      - ./reference-data:/reference-data:ro
      - api-runtime-secrets:/run/secrets:ro
      # Installer/operator helpers execute with the Node runtime supplied by
      # the signed tools image. A Hospital host does not need Node or npm.
      - ./scripts:/workspace/scripts:ro
      # The update check runs on the host, because only the host has both
      # internet access and curl -- `backend` is internal by design and no
      # clinical container may reach the registry. The host therefore has no
      # other route to the signals volume, and publishes its verdict through a
      # short-lived instance of this container.
      - status-signals:/signals
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Spelled out rather than *hardening, because a service that adds a
    # capability states its whole posture where the addition is.
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # This container is the host's only route to the signals volume, and
    # runtime-secrets-init hands that directory to the delivery worker's UID so
    # that container can stop running as root. This one runs as root and used to
    # reach it by being root -- which stopped being true when dropping every
    # capability took DAC_OVERRIDE with it. The update signal has therefore
    # never been published on any appliance, and the release row has read
    # "never checked" while the recorded answer beside it was correct.
    cap_add: [DAC_OVERRIDE]
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1g
    networks: [backend]

  caddy:
    image: ${CADDY_IMAGE:-lospor-hospital-caddy:source}
    build:
      context: .
      dockerfile: infra/docker/caddy.Dockerfile
      args:
        CADDY_BUILD_BASE_IMAGE: ${CADDY_BUILD_BASE_IMAGE:-golang:1.26.6-alpine3.24}
        CADDY_RUNTIME_BASE_IMAGE: ${CADDY_RUNTIME_BASE_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      HOSPITAL_TLS_MODE: ${HOSPITAL_TLS_MODE:-acme}
      HOSPITAL_CLINICAL_DOMAIN: ${HOSPITAL_CLINICAL_DOMAIN}
      HOSPITAL_RESEARCH_DOMAIN: ${HOSPITAL_RESEARCH_DOMAIN}
      HOSPITAL_RESEARCH_ALLOWED_CIDRS: ${HOSPITAL_RESEARCH_ALLOWED_CIDRS:?HOSPITAL_RESEARCH_ALLOWED_CIDRS is required}
      HOSPITAL_STATUS_ALLOWED_CIDRS: ${HOSPITAL_STATUS_ALLOWED_CIDRS:?HOSPITAL_STATUS_ALLOWED_CIDRS is required}
    ports:
      - "${HOSPITAL_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # An operator-supplied certificate, when there is one. Read-only, and a
      # missing directory is not an error: the other two TLS modes never look.
      - ./secrets/tls:/run/tls:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    # Ports 80 and 443 are privileged, and 80 cannot be moved because ACME
    # HTTP-01 is validated there. This is the one capability the edge needs.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *service-logging
    networks: [application, monitoring]

  # ACME is the only TLS mode that publishes host port 80.  COMPOSE_PROFILES is
  # generated from HOSPITAL_TLS_MODE, and strict readiness rejects a mismatch.
  # Local and operator-issued TLS therefore install even when another service
  # owns port 80.  This proxy uses the same integrity-verified Caddy image and
  # forwards only HTTP to the main Caddy challenge handler.
  acme-http:
    profiles: [tls-acme]
    image: ${CADDY_IMAGE:-lospor-hospital-caddy:source}
    build:
      context: .
      dockerfile: infra/docker/caddy.Dockerfile
      args:
        CADDY_BUILD_BASE_IMAGE: ${CADDY_BUILD_BASE_IMAGE:-golang:1.26.6-alpine3.24}
        CADDY_RUNTIME_BASE_IMAGE: ${CADDY_RUNTIME_BASE_IMAGE:-caddy:2.11.4-alpine}
    restart: unless-stopped
    command: ["run", "--config", "/etc/caddy/AcmeProxyCaddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
    volumes:
      - ./infra/caddy/AcmeProxyCaddyfile:/etc/caddy/AcmeProxyCaddyfile:ro
    depends_on:
      caddy:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=8m,mode=0700
      - /data:size=8m,mode=0700
    cap_drop: [ALL]
    # Host port 80 is privileged; this ACME-only proxy needs no other capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    logging: *service-logging
    networks: [application]

volumes:
  postgres-data:
  central-exports:
  research-exports:
  caddy-data:
  caddy-config:
  status-data:
  status-signals:
  status-runtime-secrets:
  api-runtime-secrets:
  api-status-runtime-secrets:

networks:
  backend:
    internal: true
  application:
    internal: false
  monitoring:
    internal: true
  # A dedicated bridge is required for Docker to publish the loopback-only
  # outage fallback. Status keeps all appliance probes on `monitoring`; no
  # clinical service joins this bridge.
  status-fallback:
    internal: false
