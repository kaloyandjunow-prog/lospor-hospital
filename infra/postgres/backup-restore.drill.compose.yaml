services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.6-bookworm}
    environment:
      POSTGRES_DB: lospor
      POSTGRES_USER: lospor
      POSTGRES_PASSWORD: hospital-restore-drill-only
    # Ask whether the database answers a query, not whether a server answers a
    # ping. The official image runs a temporary bootstrap server while it does
    # initdb, on the Unix socket only -- so a socket `pg_isready` goes green
    # against that one, and the drill's next psql lands in the gap while it
    # shuts down to restart: "the database system is shutting down". Being a
    # race it failed some runs and not others, which reads like a flaky test
    # rather than a wait asking the wrong question.
    #
    # TCP is what the bootstrap server does not accept, its listen_addresses
    # being empty; compose.yaml already asks that way, and three other waits in
    # this repo already ask both questions. This file was the one that did not.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lospor -d lospor && psql -U lospor -d lospor -tAc 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data
    networks: [drill]

  backup-tools:
    image: ${POSTGRES_IMAGE:-postgres:17.6-bookworm}
    environment:
      POSTGRES_DB: lospor
      POSTGRES_USER: lospor
      PGPASSWORD: hospital-restore-drill-only
      HOSPITAL_SIGNALS_DIR: /signals
      HOSPITAL_IO_MUTATION_LOCK_FILE: /locks/io-mutation.lock
      HOSPITAL_BACKUP_SITE_ID: site-restore-drill
      HOSPITAL_BACKUP_APPLIANCE_ID: appliance-restore-drill
      HOSPITAL_APPLIANCE_RELEASE: 1.2.1
      HOSPITAL_EXCHANGE_CONTRACT_VERSION: 2.2.0
      HOSPITAL_DATA_DICTIONARY_VERSION: 2.2.0
      HOSPITAL_BACKUP_TOOL_VERSION: 1.2.1
      HOSPITAL_BACKUP_MANIFEST_HMAC_KEY: restore-drill-only-0123456789abcdef0123456789abcdef
      HOSPITAL_PATIENT_HMAC_KEY_FINGERPRINT: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      HOSPITAL_PATIENT_ENCRYPTION_KEY_FINGERPRINT: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      HOSPITAL_EXPORT_PSEUDONYM_KEY_FINGERPRINT: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      HOSPITAL_OMOP_PSEUDONYM_SALT_FINGERPRINT: sha256:1212121212121212121212121212121212121212121212121212121212121212
      HOSPITAL_SITE_SIGNING_KEY_FINGERPRINT: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      HOSPITAL_EXTERNAL_AI_SEAL_KEY_FINGERPRINT: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      HOSPITAL_MFA_ENCRYPTION_KEY_FINGERPRINT: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      HOSPITAL_BACKUP_RESERVE_BYTES: 1048576
    volumes:
      - ./backup-once.sh:/usr/local/bin/backup-once.sh:ro
      - ./backup-object-lib.sh:/usr/local/bin/backup-object-lib.sh:ro
      - ./restore.sh:/usr/local/bin/restore.sh:ro
      - backups:/backups
      - signals:/signals
      - locks:/locks
    entrypoint: ["/bin/sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [drill]

volumes:
  database:
  backups:
  signals:
  locks:

networks:
  drill:
    internal: true
