# Security headers are appliance-owned and repeated in every location that
# emits its own add_header, because nginx only inherits add_header from an
# enclosing block when the inner block declares none of its own -- the static
# asset location below sets Cache-Control, which would otherwise silence every
# header here for the files this server serves most.
#
# The values match lospor-mobile's current PWA deployment header set, kept in
# step by hand rather than by any shared file: this appliance has no Vercel
# deployment to read it from, and the appliance's overlay gate forbids
# vercel.json from existing in this tree at all. Before this file carried them,
# the appliance shipped its PWA with no Content-Security-Policy whatsoever --
# the exact blind spot content-security-policy.pwa.spec.ts exists to close
# upstream, silently reopened here because nothing appliance-side asserted it.
# connect-src 'self' is correct for this deployment specifically: Caddy routes
# /v1/* to the API on the same origin the PWA is served from, so the browser
# never calls a different host.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }
}
